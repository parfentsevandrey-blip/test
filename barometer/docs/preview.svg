<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2e"/><stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a28"/><stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#bg)"/>
  <!-- header -->
  <rect x="28" y="26" width="44" height="44" rx="12" fill="#1b2c47" stroke="#243248"/>
  <text x="50" y="55" font-size="24" text-anchor="middle">📊</text>
  <text x="86" y="48" fill="#e8eef7" font-size="24" font-family="Georgia, serif" font-weight="600">Барометр мобилизации</text>
  <text x="86" y="66" fill="#8ea0bb" font-size="12.5">Автомониторинг СМИ, DeepState, аналитиков и облав · оценка 0–100</text>

  <!-- gauge panel -->
  <rect x="28" y="92" width="420" height="300" rx="14" fill="url(#panel)" stroke="#243248"/>
  <text x="48" y="120" fill="#8ea0bb" font-size="12" letter-spacing="1.4" font-weight="700">БАРОМЕТР РИСКА МОБИЛИЗАЦИИ</text>
  <g transform="translate(238,250)">
    <path d="M -150 0 A 150 150 0 0 1 -121.4 -88.2" fill="none" stroke="#2ec78a" stroke-width="22"/>
    <path d="M -121.4 -88.2 A 150 150 0 0 1 -46.4 -142.6" fill="none" stroke="#8bd34f" stroke-width="22"/>
    <path d="M -46.4 -142.6 A 150 150 0 0 1 88.2 -121.4" fill="none" stroke="#f2c14e" stroke-width="22"/>
    <path d="M 88.2 -121.4 A 150 150 0 0 1 147.8 -25.4" fill="none" stroke="#f08a3c" stroke-width="22"/>
    <path d="M 147.8 -25.4 A 150 150 0 0 1 150 0" fill="none" stroke="#e8514a" stroke-width="22"/>
    <!-- needle to ~40 -->
    <polygon points="-72,-96 -8,8 8,-8" fill="#8bd34f"/>
    <circle r="13" fill="#0e1420" stroke="#8bd34f" stroke-width="3"/>
  </g>
  <text x="238" y="300" fill="#8bd34f" font-size="58" font-family="monospace" font-weight="700" text-anchor="middle">40<tspan font-size="22" fill="#8ea0bb">/100</tspan></text>
  <text x="238" y="328" fill="#8bd34f" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">УМЕРЕННЫЙ РИСК</text>

  <!-- right column -->
  <rect x="464" y="92" width="408" height="142" rx="14" fill="url(#panel)" stroke="#243248"/>
  <text x="484" y="120" fill="#8ea0bb" font-size="12" letter-spacing="1.4" font-weight="700">ПРОГНОЗ И ДОСТОВЕРНОСТЬ</text>
  <text x="484" y="152" fill="#e8eef7" font-size="20" font-family="Georgia, serif">Накопление данных — прогноз</text>
  <text x="484" y="176" fill="#e8eef7" font-size="20" font-family="Georgia, serif">после нескольких замеров</text>
  <text x="484" y="206" fill="#8ea0bb" font-size="12">Достоверность оценки</text>
  <rect x="484" y="214" width="368" height="8" rx="4" fill="#1a2436"/>
  <rect x="484" y="214" width="258" height="8" rx="4" fill="#4b8fef"/>

  <!-- four pillars -->
  <rect x="464" y="250" width="408" height="142" rx="14" fill="url(#panel)" stroke="#243248"/>
  <text x="484" y="278" fill="#8ea0bb" font-size="12" letter-spacing="1.4" font-weight="700">ЧЕТЫРЕ ОПОРЫ МОНИТОРИНГА</text>
  <g font-family="monospace" font-weight="700" text-anchor="middle">
    <text x="534" y="320" font-size="22" font-family="Inter">📰</text><text x="534" y="350" fill="#e8eef7" font-size="26">50</text>
    <text x="630" y="320" font-size="22" font-family="Inter">🗺️</text><text x="630" y="350" fill="#e8eef7" font-size="26">22</text>
    <text x="726" y="320" font-size="22" font-family="Inter">🛰️</text><text x="726" y="350" fill="#e8eef7" font-size="26">9</text>
    <text x="822" y="320" font-size="22" font-family="Inter">🚨</text><text x="822" y="350" fill="#e8eef7" font-size="26">7</text>
  </g>
  <g fill="#5d6e89" font-size="10" text-anchor="middle" font-family="Inter">
    <text x="534" y="372">СМИ</text><text x="630" y="372">DeepState</text>
    <text x="726" y="372">аналитики</text><text x="822" y="372">облавы</text>
  </g>
</svg>
