[package]
name = "halo-ffi"
description = "Kotlin (and later Swift) bindings for the Halo core, via UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "halo_ffi"

[[bin]]
# Generates the Kotlin bindings from the built library:
# cargo run -p halo-ffi --features bindgen --bin uniffi-bindgen -- generate ...
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
anyhow = "1.0.104"
halo-core = { version = "1.0.0", path = "../halo-core" }
iroh = "1.3.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tun-rs = { version = "2.8.11", features = ["async"] }
uniffi = "0.32"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4.34"
tracing = { version = "0.1.44", features = ["log"] }
