<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>organism</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#04060a; overflow:hidden; }
  /* full-bleed living surface, no chrome */
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  /* bare fallback if the GPU can't run it (no web fonts, system stack only) */
  #fallback {
    position:fixed; inset:0; display:none; place-items:center; text-align:center;
    color:#7fd8c8; font:300 14px/1.6 ui-monospace,monospace; letter-spacing:.18em; padding:2rem;
    background:radial-gradient(60% 50% at 50% 45%,#0b1a1e,#04060a);
  }
  body.dead #c { display:none; }
  body.dead #fallback { display:grid; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">this organism needs a webgl2 gpu — your browser didn't grant one.</div>
<script>
"use strict";
/* =========================================================================
   ORGANISM — a living reaction–diffusion surface, hand-written in WebGL2.
   No library, no particles, no typography, no scroll, no keyframes. The
   motion is real chemistry (Gray–Scott) iterated on the GPU across two
   floating-point buffers; the look is the chemical field shaded as a wet,
   iridescent material. It grows, heals and mutates on its own — and you
   sculpt it by touching the screen.
   ========================================================================= */
const cvs = document.getElementById("c");
const gl = cvs.getContext("webgl2", { antialias:false, alpha:false, depth:false, preserveDrawingBuffer:false });
function die(){ document.body.classList.add("dead"); }
if (!gl || !gl.getExtension("EXT_color_buffer_float")) { die(); throw new Error("no webgl2 float"); }
gl.getExtension("OES_texture_float_linear");

/* ---------- shader helpers ---------- */
function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s), src); }
  return s;
}
function prog(vs, fs){
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const VERT = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

/* Gray–Scott step: state.x = chemical A, state.y = chemical B.
   9-point Laplacian, several substeps per frame, plus a soft brush that
   injects B (life) under the pointer. Feed/kill drift through regimes so
   the pattern keeps transforming even when untouched. */
const SIM = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D S; uniform vec2 texel; uniform vec2 aspect;
uniform float feed, kill, dA, dB, dt, time;
uniform vec2 brush; uniform float brushOn, brushR;
vec2 g(vec2 d){ return texture(S, uv+texel*d).xy; }
void main(){
  vec2 s = texture(S, uv).xy;
  vec2 lap = g(vec2(-1,0))*0.2 + g(vec2(1,0))*0.2 + g(vec2(0,-1))*0.2 + g(vec2(0,1))*0.2
           + g(vec2(-1,-1))*0.05 + g(vec2(1,-1))*0.05 + g(vec2(-1,1))*0.05 + g(vec2(1,1))*0.05
           - s;
  float A = s.x, B = s.y, r = A*B*B;
  // a gentle spatial breathing in the feed makes the organism asymmetric & alive
  float f = feed + 0.006*sin(uv.y*5.0 + time*0.15) + 0.005*sin(uv.x*4.0 - time*0.1);
  A += (dA*lap.x - r + f*(1.0-A)) * dt;
  B += (dB*lap.y + r - (kill+f)*B) * dt;
  float d = length((uv-brush)*aspect);
  B += brushOn * smoothstep(brushR, 0.0, d) * 0.32;
  o = vec4(clamp(A,0.0,1.0), clamp(B,0.0,1.0), 0.0, 1.0);
}`;

/* Render: treat B as a height field — derive a normal, light it with two
   moving lights (one trails the pointer), add specular sheen + a fresnel
   rim, and colour it through a slowly-evolving iridescent palette so the
   surface reads as living, wet, jewel-like tissue rather than a flat plot. */
const REND = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D S; uniform vec2 texel; uniform float time; uniform vec2 ptr; uniform vec2 res;
vec3 ramp(float t){ t=clamp(t,0.0,1.0);
  vec3 a=vec3(0.04,0.22,0.27), b=vec3(0.09,0.62,0.60), c=vec3(0.97,0.80,0.36), d=vec3(0.92,0.30,0.55);
  vec3 col=mix(a,b,smoothstep(0.0,0.40,t)); col=mix(col,c,smoothstep(0.40,0.72,t)); col=mix(col,d,smoothstep(0.72,1.0,t)); return col; }
float B(vec2 p){ return texture(S,p).y; }
void main(){
  float b = B(uv);
  float bx = B(uv+vec2(texel.x,0.0)) - B(uv-vec2(texel.x,0.0));
  float by = B(uv+vec2(0.0,texel.y)) - B(uv-vec2(0.0,texel.y));
  vec3 n = normalize(vec3(-bx, -by, 0.04));
  vec3 V = vec3(0.0,0.0,1.0);
  vec3 L1 = normalize(vec3(cos(time*0.18)*0.5, sin(time*0.13)*0.5, 0.85));
  vec3 L2 = normalize(vec3((ptr.x*2.0-1.0)*0.9, (ptr.y*2.0-1.0)*0.9, 0.7));
  float d1 = max(dot(n,L1),0.0), d2 = max(dot(n,L2),0.0);
  float sp1 = pow(max(dot(n, normalize(L1+V)),0.0), 60.0);
  float sp2 = pow(max(dot(n, normalize(L2+V)),0.0), 90.0);
  float fres = pow(1.0 - max(n.z,0.0), 3.0);
  // colour: a faintly-living substrate -> curated tissue palette by density
  vec3 deep = mix(vec3(0.012,0.030,0.05), vec3(0.03,0.07,0.11), 0.5+0.5*sin(uv.x*2.2+uv.y*1.8+time*0.05));
  // hue spreads across the real B range + broad, low-freq spatial zones (no edge fringing)
  float hue = b*2.1 + 0.30*sin(uv.x*2.6 + time*0.06) + 0.22*sin(uv.y*2.0 - time*0.045);
  vec3 base = ramp(clamp(hue, 0.0, 1.0));
  vec3 col = mix(deep, base, smoothstep(0.03, 0.40, b));
  col *= 0.32 + d1*0.60 + d2*0.50;                                 // diffuse
  col += vec3(1.0,0.95,0.85)*sp1*0.8 + vec3(0.7,0.95,1.0)*sp2*0.6; // speculars (white, not rainbow)
  col += fres * vec3(0.18,0.68,0.70) * 0.32;                       // aqua fresnel rim
  col += base * pow(b,3.0) * 0.30;                                 // inner glow in dense tissue
  col = col / (col + 0.85) * 1.50;                                 // filmic-ish lift
  float vig = smoothstep(1.30, 0.25, length(uv-0.5)*1.50);
  col *= mix(0.50, 1.0, vig);
  o = vec4(pow(max(col,0.0), vec3(0.85)), 1.0);                    // gentle gamma
}`;

const simP = prog(VERT, SIM), renP = prog(VERT, REND);

/* fullscreen triangle */
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
for (const p of [simP, renP]){ const l = gl.getAttribLocation(p,"p"); gl.enableVertexAttribArray(l); }
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(0);

/* ---------- simulation buffers (ping-pong RGBA16F) ---------- */
let SW, SH, tex = [], fbo = [], cur = 0;
function makeTarget(w, h, data){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f };
}
function seed(w, h){
  const a = new Float32Array(w*h*4);
  for (let i=0;i<w*h;i++){ a[i*4]=1.0; a[i*4+3]=1.0; }            // A=1, B=0
  const blobs = 54 + (Math.sqrt(w*h)/18|0);
  for (let k=0;k<blobs;k++){
    const cx=Math.random()*w, cy=Math.random()*h, rad=10+Math.random()*30;
    for (let y=-rad;y<=rad;y++) for (let x=-rad;x<=rad;x++){
      if (x*x+y*y>rad*rad) continue;
      const px=(cx+x)|0, py=(cy+y)|0; if (px<0||py<0||px>=w||py>=h) continue;
      a[(py*w+px)*4+1] = 0.9;                                       // B
    }
  }
  return a;
}
function build(){
  // run the chemistry at a capped resolution for speed; the render upscales smoothly
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cvs.width = Math.floor(innerWidth*dpr); cvs.height = Math.floor(innerHeight*dpr);
  const longest = Math.max(innerWidth, innerHeight);
  const scale = Math.min(1, 900/longest);
  SW = Math.max(64, Math.floor(innerWidth*scale)); SH = Math.max(64, Math.floor(innerHeight*scale));
  for (const o of [tex[0],tex[1]]) if (o){ gl.deleteTexture(o.t); }
  for (const f of [fbo[0],fbo[1]]) if (f){ gl.deleteFramebuffer(f); }
  const A = makeTarget(SW, SH, seed(SW, SH)), Bt = makeTarget(SW, SH, null);
  tex = [A, Bt]; cur = 0;
}
build();
addEventListener("resize", build, { passive:true });

/* ---------- regimes (feed,kill) the organism drifts through ---------- */
const REGIMES = [
  [0.0545,0.0620],[0.0367,0.0649],[0.0545,0.0610],[0.0290,0.0570],
  [0.0390,0.0580],[0.0620,0.0610],[0.0260,0.0550],[0.0470,0.0630],
];
let ri = 0, rt = 0;
const lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>t*t*(3-2*t);

/* ---------- pointer ---------- */
const ptr = { x:0.5, y:0.5, on:0, last:0 };
function move(e){
  const t = e.touches ? e.touches[0] : e;
  ptr.x = t.clientX/innerWidth; ptr.y = 1.0 - t.clientY/innerHeight; ptr.last = performance.now();
}
cvs.addEventListener("pointermove", e=>{ move(e); if (ptr.on<0.18) ptr.on = 0.18; }, { passive:true });
cvs.addEventListener("pointerdown", e=>{ move(e); ptr.on = 0.6; }, { passive:true });
addEventListener("pointerup", ()=>{ ptr.on = 0; }, { passive:true });

/* ---------- uniform locations ---------- */
const U = (p,n)=>gl.getUniformLocation(p,n);
const su = {S:U(simP,"S"),texel:U(simP,"texel"),aspect:U(simP,"aspect"),feed:U(simP,"feed"),kill:U(simP,"kill"),dA:U(simP,"dA"),dB:U(simP,"dB"),dt:U(simP,"dt"),time:U(simP,"time"),brush:U(simP,"brush"),brushOn:U(simP,"brushOn"),brushR:U(simP,"brushR")};
const ru = {S:U(renP,"S"),texel:U(renP,"texel"),time:U(renP,"time"),ptr:U(renP,"ptr"),res:U(renP,"res")};

let t0 = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const time = (now - t0)/1000;

  // drift feed/kill between regimes (~14s each) so it never settles
  rt += 1/60/14;
  if (rt >= 1){ rt -= 1; ri = (ri+1)%REGIMES.length; }
  const a = REGIMES[ri], b = REGIMES[(ri+1)%REGIMES.length], e = smooth(rt);
  const feed = lerp(a[0], b[0], e), kill = lerp(a[1], b[1], e);

  const idle = (now - ptr.last) > 140;
  const brushOn = idle ? 0 : ptr.on;
  const asp = innerWidth/innerHeight;

  // ---- chemistry substeps ----
  gl.useProgram(simP); gl.bindVertexArray(vao); gl.viewport(0,0,SW,SH);
  gl.uniform2f(su.texel, 1/SW, 1/SH); gl.uniform2f(su.aspect, asp, 1.0);
  gl.uniform1f(su.feed, feed); gl.uniform1f(su.kill, kill);
  gl.uniform1f(su.dA, 1.0); gl.uniform1f(su.dB, 0.5); gl.uniform1f(su.dt, 1.0); gl.uniform1f(su.time, time);
  gl.uniform2f(su.brush, ptr.x, ptr.y); gl.uniform1f(su.brushR, 0.045);
  const STEPS = 14;
  for (let i=0;i<STEPS;i++){
    gl.uniform1f(su.brushOn, brushOn);                 // inject every substep while active
    gl.bindFramebuffer(gl.FRAMEBUFFER, tex[1-cur].f);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[cur].t); gl.uniform1i(su.S, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    cur = 1-cur;
  }

  // ---- shade to screen ----
  gl.useProgram(renP); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,cvs.width,cvs.height);
  gl.uniform2f(ru.texel, 1/SW, 1/SH); gl.uniform1f(ru.time, time);
  gl.uniform2f(ru.ptr, ptr.x, ptr.y); gl.uniform2f(ru.res, cvs.width, cvs.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[cur].t); gl.uniform1i(ru.S, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
