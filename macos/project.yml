# XcodeGen input.
#
# The project is kept here rather than as a .pbxproj because a pbxproj cannot
# be reviewed: it is generated, order-dependent and merges badly, and every
# change to it arrives as an unreadable diff. `xcodegen generate` turns this
# into one.
#
# Two things must be yours before this builds: DEVELOPMENT_TEAM, and the App
# Group. A packet tunnel needs an entitlement Apple issues only to a paid
# team, and the group identifier has to be one your team owns.

name: Veil
options:
  bundleIdPrefix: app.veil
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Set this to your team, or Xcode cannot sign a network extension.
    DEVELOPMENT_TEAM: ""
    # Swift 5 language mode deliberately. NEPacketTunnelProvider and its
    # options dictionary carry no Sendable annotations, so under Swift 6's
    # complete checking an async override of startTunnel(options:) cannot be
    # written at all — the parameter is non-Sendable and the superclass method
    # is nonisolated. Swift 5 mode is the supported way to subclass these
    # today; the concurrency here is plain actors and @MainActor, which behave
    # identically either way.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    # Go's net package resolves names through libresolv on Apple platforms,
    # and gomobile does not link it for you: without this the link fails on
    # _res_9_nsearch with nothing to say about where it came from.
    OTHER_LDFLAGS: "-lresolv"

packages: {}

targets:
  Veil:
    type: application
    platform: macOS
    sources:
      - path: Veil
        excludes:
          - "Resources/**"
      # Folder references, not groups. A group flattens the tree into
      # Contents/Resources, and both seed/ and blocklist/ carry a file called
      # STAMP — which Xcode refuses to build, because two copy commands would
      # produce the same output. Keeping the directories is also what the code
      # asks for: it looks each asset up with a `subdirectory:`.
      - path: Veil/Resources/builtin_bridges.json
        buildPhase: resources
      - path: Veil/Resources/seed
        type: folder
        buildPhase: resources
      - path: Veil/Resources/blocklist
        type: folder
        buildPhase: resources
      # Fetched by scripts/fetch-tor.sh, so absent on a fresh checkout.
      - path: Veil/Resources/tor
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: VeilTunnel
        embed: true
      - framework: Frameworks/Veiltun.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veil.mac
        INFOPLIST_FILE: Veil/Info.plist
        CODE_SIGN_ENTITLEMENTS: Veil/Veil.entitlements
        # See Veil.entitlements: the proxy mode needs an administrator prompt.
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        # The tor binary is the Tor Project's, so it arrives signed by them.
        # Xcode re-signs it on copy; without this the hardened runtime refuses
        # to execute it.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "--deep"

  VeilTunnel:
    type: app-extension
    platform: macOS
    sources:
      - VeilTunnel
    dependencies:
      - framework: Frameworks/Veiltun.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veil.mac.tunnel
        INFOPLIST_FILE: VeilTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: VeilTunnel/VeilTunnel.entitlements
        # The framework is embedded once, by the app. From inside
        # Contents/PlugIns/VeilTunnel.appex/Contents/MacOS, the app's
        # Frameworks directory is four levels up.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
        ENABLE_APP_SANDBOX: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Veil:
    build:
      targets:
        Veil: all
        VeilTunnel: all
    run:
      config: Debug
    archive:
      config: Release
