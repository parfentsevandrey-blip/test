<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашний сервер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c9a35e'/%3E%3Cpath d='M8 15.5 16 9l8 6.5V24H8z' fill='none' stroke='%2306080d' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #06080d;
  --bg-2: #0a0d14;
  --panel: #0e121c;
  --panel-2: #121827;
  --raise: #182033;
  --ink: #eef0f4;
  --ink-soft: #a6adbd;
  --ink-faint: #687083;
  --line: rgba(201, 163, 94, 0.2);
  --line-soft: rgba(255, 255, 255, 0.075);
  --gold: #c9a35e;
  --gold-2: #e7c98a;
  --gold-deep: #9c7a3e;
  --ok: #4ade80;
  --warn: #f5b942;
  --err: #f87171;
  --info: #8db4ff;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(201, 163, 94, 0.09), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(80, 110, 190, 0.08), transparent 60%),
    var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: var(--gold-2); }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }
.ic-lg { width: 28px; height: 28px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 6px;
  padding: 22px 16px 18px;
  background: linear-gradient(180deg, rgba(14, 18, 28, 0.92), rgba(8, 11, 17, 0.92));
  border-right: 1px solid var(--line-soft);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--gold-2), var(--gold) 55%, var(--gold-deep));
  color: #0b0d12; box-shadow: 0 10px 24px -12px rgba(201, 163, 94, 0.8);
}
.brand-mark .ic { width: 24px; height: 24px; stroke-width: 2; }
.brand b { display: block; font: 600 16px/1.2 var(--display); letter-spacing: 0.01em; }
.brand span { font-size: 12.5px; color: var(--ink-faint); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px;
  color: var(--ink-soft); text-decoration: none; border: 1px solid transparent;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.nav a:hover { background: rgba(255, 255, 255, 0.04); color: var(--ink); }
.nav a.active { background: rgba(201, 163, 94, 0.1); border-color: var(--line); color: var(--ink); }
.nav a.active .ic { color: var(--gold-2); }
.nav .num {
  margin-left: auto; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11.5px; color: var(--ink-faint); border: 1px solid var(--line-soft);
}
.nav .num.ok { color: #08130c; background: var(--ok); border-color: var(--ok); }
.nav .num.err { color: #1a0808; background: var(--err); border-color: var(--err); }
.nav .num.warn { color: #1a1206; background: var(--warn); border-color: var(--warn); }
.nav .num.todo { color: var(--gold-2); border-color: var(--gold); }
.nav-sep { height: 1px; margin: 10px 8px; background: var(--line-soft); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-faint); }
.side-foot button {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px;
  background: none; border: 0; color: var(--ink-faint); cursor: pointer; text-align: left;
}
.side-foot button:hover { background: rgba(255, 255, 255, 0.04); color: var(--ink-soft); }
.side-foot button.danger:hover { color: var(--err); }
.side-foot .ver { padding: 6px 12px 0; }

.main { min-width: 0; padding: 26px 34px 60px; }
.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.top h1 { margin: 0; font: 600 25px/1.2 var(--display); letter-spacing: -0.01em; }
.top p { margin: 4px 0 0; color: var(--ink-soft); }
.top .grow { flex: 1; }
.view { display: grid; gap: 18px; animation: rise 0.45s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- building blocks ---------- */
.card {
  position: relative; padding: 22px 24px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
  border: 1px solid var(--line-soft); border-radius: 18px;
}
.card h2 { margin: 0 0 6px; font: 600 17px/1.3 var(--display); display: flex; align-items: center; gap: 10px; }
.card h2 .ic { color: var(--gold-2); }
.card > p, .muted { color: var(--ink-soft); }
.card > p { margin: 0 0 14px; }
.card.accent { border-color: var(--line); background: linear-gradient(180deg, rgba(201, 163, 94, 0.09), rgba(201, 163, 94, 0.02)); }
.card.bad { border-color: rgba(248, 113, 113, 0.35); background: linear-gradient(180deg, rgba(248, 113, 113, 0.08), rgba(248, 113, 113, 0.02)); }
.card.good { border-color: rgba(74, 222, 128, 0.3); background: linear-gradient(180deg, rgba(74, 222, 128, 0.07), rgba(74, 222, 128, 0.015)); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.small { font-size: 12.5px; }
.faint { color: var(--ink-faint); }
.hr { height: 1px; background: var(--line-soft); margin: 16px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: 11px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line-soft); background: rgba(255, 255, 255, 0.045); color: var(--ink);
  transition: transform 0.2s var(--ease), background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.gold {
  border: 0; color: #0d0f14; font-weight: 600;
  background: linear-gradient(135deg, var(--gold-2), var(--gold) 60%, #b48c49);
  box-shadow: 0 10px 26px -14px rgba(201, 163, 94, 0.9);
}
.btn.gold:hover:not(:disabled) { background: linear-gradient(135deg, #f0d8a4, var(--gold-2) 55%, var(--gold)); box-shadow: 0 16px 34px -14px rgba(201, 163, 94, 0.95); }
.btn.big { height: 48px; padding: 0 26px; font-size: 15.5px; border-radius: 13px; }
.btn.danger { color: #ffd1d1; border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.1); }
.btn.danger:hover:not(:disabled) { background: rgba(248, 113, 113, 0.18); border-color: rgba(248, 113, 113, 0.6); }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); padding: 0 10px; }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn .spin { width: 16px; height: 16px; }

.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 13px 0 11px;
  border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--line-soft); background: rgba(255, 255, 255, 0.04); color: var(--ink-soft);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: none; }
.pill.ok { color: var(--ok); border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.08); }
.pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); animation: pulse 2.2s infinite; }
.pill.err { color: var(--err); border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); }
.pill.err .dot { background: var(--err); }
.pill.warn { color: var(--warn); border-color: rgba(245, 185, 66, 0.35); background: rgba(245, 185, 66, 0.08); }
.pill.warn .dot { background: var(--warn); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); } 70% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }

.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: var(--gold-2); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; margin: 0; }
.kv dt { color: var(--ink-faint); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.check { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
.check .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.check .mark .ic { width: 14px; height: 14px; stroke-width: 2.6; }
.mark.ok { background: rgba(74, 222, 128, 0.16); color: var(--ok); }
.mark.err { background: rgba(248, 113, 113, 0.16); color: var(--err); }
.mark.warn { background: rgba(245, 185, 66, 0.16); color: var(--warn); }
.mark.wait { border: 1.5px solid rgba(255, 255, 255, 0.16); }
.mark.idle { background: rgba(255, 255, 255, 0.06); color: var(--ink-faint); }
.check b { font-weight: 600; }
.check .note { display: block; color: var(--ink-soft); font-size: 13px; overflow-wrap: anywhere; }
.check.error .note { color: #ffb4b4; }

.callout { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 13px; background: rgba(141, 180, 255, 0.07); border: 1px solid rgba(141, 180, 255, 0.2); color: #cfdcff; }
.callout.ok { background: rgba(74, 222, 128, 0.07); border-color: rgba(74, 222, 128, 0.25); color: #c9f5d8; }
.callout.warn { background: rgba(245, 185, 66, 0.07); border-color: rgba(245, 185, 66, 0.25); color: #f8dfa9; }
.callout.err { background: rgba(248, 113, 113, 0.07); border-color: rgba(248, 113, 113, 0.3); color: #ffc9c9; }
.callout .ic { margin-top: 2px; }
.callout p { margin: 0; }

.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--ink-soft); }
.input {
  display: flex; align-items: center; height: 44px; border-radius: 11px; overflow: hidden;
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line-soft); transition: border-color 0.2s, box-shadow 0.2s;
}
.input:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 163, 94, 0.16); }
.input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; padding: 0 14px; }
.input .suffix { padding: 0 14px; color: var(--ink-faint); white-space: nowrap; }
.input button { height: 100%; border: 0; background: none; color: var(--ink-faint); padding: 0 12px; cursor: pointer; }
.input button:hover { color: var(--ink); }
.hint { font-size: 12.5px; color: var(--ink-faint); }
.checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--ink-soft); margin-bottom: 14px; }
.checkbox input { width: 18px; height: 18px; accent-color: var(--gold); }

.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 13px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line-soft); flex-wrap: wrap; }
.seg button { height: 36px; padding: 0 16px; border-radius: 10px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; }
.seg button.on { background: var(--raise); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.steps { counter-reset: step; display: grid; gap: 14px; margin: 4px 0 18px; padding: 0; list-style: none; }
.steps > li { position: relative; padding-left: 44px; min-height: 30px; }
.steps > li::before {
  counter-increment: step; content: counter(step);
  position: absolute; left: 0; top: -1px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 600; font-size: 13.5px;
  color: var(--gold-2); border: 1px solid var(--line); background: rgba(201, 163, 94, 0.08);
}
.steps b { font-weight: 600; }

.copybox { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 11px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line-soft); }
.copybox .val { font-family: var(--mono); font-size: 14px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.biglink { font: 600 19px/1.3 var(--display); color: var(--ink); overflow-wrap: anywhere; }
.biglink.long { font-size: 15.5px; }

table.rules { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.rules th { text-align: left; font-weight: 500; color: var(--ink-faint); padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
table.rules td { padding: 10px; border-bottom: 1px solid var(--line-soft); }
table.rules td.mono { color: var(--gold-2); }

details.fold > summary { list-style: none; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; }
details.fold > summary h2::after { content: "Показать"; margin-left: auto; font: 500 13px/1 var(--sans); color: var(--ink-faint); }
details.fold[open] > summary h2::after { content: "Скрыть"; }
details.fold[open] > summary { margin-bottom: 12px; }
details.acc { border: 1px solid var(--line-soft); border-radius: 12px; padding: 0 14px; background: rgba(0, 0, 0, 0.18); }
details.acc + details.acc { margin-top: 8px; }
details.acc summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; margin-left: auto; color: var(--ink-faint); font-size: 18px; }
details.acc[open] summary::after { content: "−"; }
details.acc .body { padding: 0 0 14px; color: var(--ink-soft); }
details.acc .body p { margin: 0 0 8px; }

/* ---------- connection map ---------- */
.map { display: grid; grid-template-columns: 1fr 60px 1fr 60px 1fr 60px 1fr; align-items: start; padding: 10px 4px 2px; }
.node { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; cursor: pointer; padding: 6px 4px 8px; border-radius: 14px; transition: background 0.2s; }
.node:hover { background: rgba(255, 255, 255, 0.03); }
.orb {
  position: relative; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #1d263b, #0d1220 70%);
  border: 1.5px solid rgba(255, 255, 255, 0.1); color: var(--ink-soft);
  transition: border-color 0.3s, box-shadow 0.3s, color 0.3s;
}
.orb .ic { width: 32px; height: 32px; stroke-width: 1.5; }
.orb .badge {
  position: absolute; right: -3px; bottom: -3px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; border: 3px solid var(--bg-2); background: var(--raise); color: var(--ink-faint);
}
.orb .badge .ic { width: 13px; height: 13px; stroke-width: 3; }
.node.ok .orb { border-color: rgba(74, 222, 128, 0.55); color: var(--ok); box-shadow: 0 0 34px -10px rgba(74, 222, 128, 0.55); }
.node.ok .badge { background: var(--ok); color: #06210f; }
.node.err .orb { border-color: rgba(248, 113, 113, 0.6); color: var(--err); box-shadow: 0 0 34px -12px rgba(248, 113, 113, 0.6); }
.node.err .badge { background: var(--err); color: #2a0707; }
.node.warn .orb { border-color: rgba(245, 185, 66, 0.6); color: var(--warn); }
.node.warn .badge { background: var(--warn); color: #2a1a03; }
.node.todo .orb { border-color: var(--gold); color: var(--gold-2); box-shadow: 0 0 0 6px rgba(201, 163, 94, 0.08); animation: breathe 2.6s ease-in-out infinite; }
.node.todo .badge { background: var(--gold); color: #1d1404; }
@keyframes breathe { 50% { box-shadow: 0 0 0 11px rgba(201, 163, 94, 0.04); } }
.node b { font: 600 15px/1.25 var(--display); }
.node .sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; min-height: 36px; overflow-wrap: anywhere; }
.link { position: relative; height: 3px; margin-top: 37px; border-radius: 3px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.14) 0 6px, transparent 6px 12px); }
.link.on { background: linear-gradient(90deg, rgba(74, 222, 128, 0.15), rgba(74, 222, 128, 0.7), rgba(74, 222, 128, 0.15)); background-size: 200% 100%; animation: flow 1.8s linear infinite; }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.next { display: flex; align-items: center; gap: 18px; }
.next .ico { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: rgba(201, 163, 94, 0.14); color: var(--gold-2); flex: none; }
.next.good .ico { background: rgba(74, 222, 128, 0.14); color: var(--ok); }
.next h3 { margin: 0 0 2px; font: 600 17px/1.3 var(--display); }
.next p { margin: 0; color: var(--ink-soft); }

.qrbox { display: flex; gap: 18px; align-items: center; }
.qr { border-radius: 12px; flex: none; box-shadow: 0 12px 30px -16px rgba(0, 0, 0, 0.9); }

/* ---------- install progress ---------- */
.plist { display: grid; gap: 2px; }
.pitem { display: flex; gap: 14px; align-items: flex-start; padding: 11px 12px; border-radius: 12px; transition: background 0.3s; }
.pitem.run { background: rgba(201, 163, 94, 0.07); }
.pitem .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.pitem .mark .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.pitem b { font-weight: 600; display: block; }
.pitem .note { font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.pitem.error .note { color: #ffb4b4; }
.pitem.wait b { color: var(--ink-faint); font-weight: 500; }

.feature { display: flex; gap: 14px; align-items: flex-start; }
.feature .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--gold-2); flex: none; }
.feature b { display: block; font-weight: 600; margin-bottom: 2px; }
.feature span { color: var(--ink-soft); font-size: 13.5px; }

/* ---------- external check ---------- */
.nodes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cnode { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 13px; border: 1px solid var(--line-soft); background: rgba(0, 0, 0, 0.2); }
.cnode .cc { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font: 700 12.5px/1 var(--mono); letter-spacing: 0.04em; background: var(--raise); color: var(--ink-soft); flex: none; }
.cnode.ok { border-color: rgba(74, 222, 128, 0.28); }
.cnode.ok .cc { background: rgba(74, 222, 128, 0.14); color: var(--ok); }
.cnode.bad { border-color: rgba(248, 113, 113, 0.3); }
.cnode.bad .cc { background: rgba(248, 113, 113, 0.14); color: var(--err); }
.cnode b { display: block; font-weight: 600; font-size: 13.5px; }
.cnode span { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }

/* ---------- logs ---------- */
.log { margin: 0; max-height: 560px; overflow: auto; padding: 14px 16px; border-radius: 12px; background: #05070b; border: 1px solid var(--line-soft); font: 12.5px/1.6 var(--mono); color: #b9c0cf; white-space: pre-wrap; overflow-wrap: anywhere; }
.log .e { color: #ff9c9c; }
.log .w { color: #f7cf7d; }
.log .i { color: #b9c0cf; }

/* ---------- toasts, modal, overlay ---------- */
#toasts { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.toast {
  display: flex; gap: 10px; align-items: flex-start; max-width: 420px; padding: 13px 16px; border-radius: 13px;
  background: #151c2c; border: 1px solid var(--line-soft); box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.9);
  animation: rise 0.35s var(--ease);
}
.toast.ok .ic { color: var(--ok); }
.toast.err { border-color: rgba(248, 113, 113, 0.4); }
.toast.err .ic { color: var(--err); }
.modal-bg { position: fixed; inset: 0; background: rgba(3, 5, 9, 0.72); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 40; animation: fade 0.25s; padding: 20px; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 26px; border-radius: 20px; background: #0f1420; border: 1px solid var(--line-soft); box-shadow: 0 30px 80px -30px #000; animation: rise 0.35s var(--ease); }
.modal h2 { margin: 0 0 8px; font: 600 20px/1.3 var(--display); }
.modal p { color: var(--ink-soft); }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 7, 12, 0.9); z-index: 60; text-align: center; padding: 24px; }
.overlay h2 { font: 600 22px/1.3 var(--display); margin: 14px 0 6px; }
.overlay p { color: var(--ink-soft); margin: 0; }

.skeleton { height: 14px; border-radius: 7px; background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.05)); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

@media (max-width: 1100px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nodes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px; }
  .brand { padding: 0 8px 0 0; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav .num, .nav-sep, .side-foot .ver { display: none; }
  .side-foot { margin: 0 0 0 auto; flex-direction: row; }
  .main { padding: 20px 16px 50px; }
  .grid2, .grid3, .nodes { grid-template-columns: 1fr; }
  .map { grid-template-columns: 1fr; gap: 6px; }
  .link { width: 3px; height: 26px; margin: 0 auto; background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0 6px, transparent 6px 12px); }
  .link.on { background: rgba(74, 222, 128, 0.6); animation: none; }
  #toasts { left: 12px; right: 12px; bottom: 12px; }
  .toast { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const S = {
  status: null, net: null, netBusy: false, netError: "",
  ext: null, extBusy: false,
  install: null, uninstall: null,
  view: "overview", domainTab: null, logsTab: "caddy", logs: null,
  busy: {}, form: {}, fold: {}, disconnected: false, polling: false,
};

/* ------------------------------------------------------------ helpers */
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (name, cls = "") => `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`;
const spin = () => `<span class="spin"></span>`;
const markIcon = { ok: "check", err: "x", warn: "excl", todo: "arrow", idle: "excl" };

function toast(text, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `${ic(kind === "err" ? "alert" : "check")}<div>${esc(text)}</div>`;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), kind === "err" ? 9000 : 4200);
}

async function api(path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(path, {
      method, cache: "no-store",
      headers: Object.assign({ "X-Token": TOKEN }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    showDisconnected();
    throw new Error("Нет связи с панелью");
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* пустой ответ */ }
  if (!res.ok) throw new Error((data && data.error) || `Ошибка ${res.status}`);
  return data;
}

// Потоковый ответ: по строке JSON на каждый шаг установки/удаления.
async function stream(path, onMessage) {
  const res = await fetch(path, { method: "POST", headers: { "X-Token": TOKEN }, cache: "no-store" });
  if (!res.ok || !res.body) throw new Error(`Ошибка ${res.status}`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) onMessage(JSON.parse(line));
    }
  }
}

function qrSvg(text, px = 132) {
  const q = qrcode(0, "M");
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), pad = 2, size = n + pad * 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR-код ${esc(text)}"><rect width="${size}" height="${size}" rx="2" fill="#f5f0e6"/><path d="${d}" fill="#0b0e15"/></svg>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано: " + text); }
  catch (e) { toast("Не получилось скопировать — выделите текст и нажмите Ctrl+C", "err"); }
}
const openUrl = (url) => window.open(url, "_blank", "noopener");

const btnBusy = (key, label, iconName) => S.busy[key] ? `${spin()}<span>${label}</span>` : `${iconName ? ic(iconName) : ""}<span>${label}</span>`;

function confirmModal({ title, html, confirm = "Продолжить", danger = false }) {
  return new Promise((resolve) => {
    $("#modal").innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">
      <h2>${esc(title)}</h2><div class="muted">${html}</div>
      <div class="row end" style="margin-top:20px">
        <button class="btn" data-m="no">Отмена</button>
        <button class="btn ${danger ? "danger" : "gold"}" data-m="yes">${esc(confirm)}</button>
      </div></div></div>`;
    $("#modal").onclick = (e) => {
      const b = e.target.closest("[data-m]");
      if (!b && e.target.closest(".modal")) return;
      $("#modal").innerHTML = "";
      resolve(Boolean(b && b.dataset.m === "yes"));
    };
  });
}

function showDisconnected() {
  if (S.disconnected) return;
  S.disconnected = true;
  const el = document.createElement("div");
  el.className = "overlay";
  el.innerHTML = `<div><div class="orb" style="margin:0 auto;color:var(--ink-faint)">${ic("server")}</div>
    <h2>Панель отключилась</h2><p>Закройте это окно и снова запустите <b>home-server.cmd</b>.<br>Сервер с сайтом при этом продолжает работать.</p></div>`;
  document.body.append(el);
}

/* ---------------------------------------------------- derived state */
// Домен для показа человеку: xn--12-dlctggdc8a5ahlb.xn--p1ai -> кутузовский12.рф
const dn = (d) => (S.status && S.status.domainLabels && S.status.domainLabels[d]) || d;
const lanUrl = () => S.status && S.status.lan && S.status.lan.ip ? `http://${S.status.lan.ip}` : "";
const publicIp = () => (S.net && S.net.publicIp) || (S.status && S.status.publicIp) || "";
function publicUrl() {
  const st = S.status;
  if (!st) return "";
  if (st.domains.length) return `https://${st.domains[0]}`;
  const ext = st.external;
  if (ext && ext.okCount > 0 && /^http:\/\/\d/.test(ext.url)) return ext.url;
  return "";
}
function pubLabel() {
  const st = S.status;
  return st && st.domains.length ? `https://${dn(st.domains[0])}` : publicUrl();
}
function ipType() { return S.net ? S.net.ipType : (S.status ? S.status.ipType : ""); }
function serverState() {
  const st = S.status;
  if (!st) return { kind: "", text: "" };
  if (!st.installed) return { kind: "", text: "Не установлен" };
  if (st.service !== "Running") return { kind: "err", text: "Сервер остановлен" };
  if (!st.localOk) return { kind: "warn", text: "Сайт не отвечает" };
  return { kind: "ok", text: "Сайт работает" };
}
function domainHealth() {
  const st = S.status;
  if (!st || !st.domains.length) return null;
  if (!S.net) return { state: "warn", text: "Проверяю…" };
  const dnsBad = S.net.dns.filter((d) => !d.ok);
  const certs = S.net.certs;
  if (dnsBad.length) return { state: "err", text: dnsBad[0].ips.length ? "Указывает не на ваш IP" : "Домен не найден в DNS" };
  if (certs.some((c) => c.state === "error")) return { state: "err", text: "Ошибка HTTPS-сертификата" };
  if (certs.some((c) => c.state !== "ok")) return { state: "warn", text: "Получаем HTTPS-сертификат…" };
  return { state: "ok", text: "DNS и HTTPS в порядке" };
}

function computeMap() {
  const st = S.status;
  const sv = serverState();
  const ext = st.external;
  const laptop = { id: "install", title: "Компьютер", icon: "laptop" };
  if (!st.installed) Object.assign(laptop, { state: "todo", sub: "Сервер не установлен" });
  else Object.assign(laptop, { state: sv.kind || "warn", sub: sv.text + (st.lan.ssid ? ` · ${st.lan.ssid}` : "") });

  const router = { id: "router", title: "Роутер", icon: "router" };
  const upnpOk = S.net && S.net.upnp && S.net.upnp.mapped.length >= 2;
  if (ipType() === "grey") Object.assign(router, { state: "err", sub: "Серый IP — сайт не виден из интернета" });
  else if (ext && ext.okCount > 0) Object.assign(router, { state: "ok", sub: "Порты 80 и 443 открыты" });
  else if (upnpOk) Object.assign(router, { state: "ok", sub: "Порты открыты автоматически" });
  else Object.assign(router, { state: st.installed ? "todo" : "idle", sub: "Нужно открыть порты 80 и 443" });

  const domain = { id: "domain", title: "Домен", icon: "globe" };
  const dh = domainHealth();
  if (!st.domains.length) Object.assign(domain, { state: router.state === "ok" ? "todo" : "idle", sub: "Адрес сайта ещё не выбран" });
  else Object.assign(domain, { state: dh.state, sub: `${dn(st.domains[0])} · ${dh.text}` });

  const people = { id: "check", title: "Посетители", icon: "phone" };
  if (!ext) Object.assign(people, { state: domain.state === "ok" ? "todo" : "idle", sub: "Доступ из интернета ещё не проверяли" });
  else if (ext.ok) Object.assign(people, { state: "ok", sub: `Открывается во всех ${ext.total} странах проверки` });
  else if (ext.okCount > 0) Object.assign(people, { state: "warn", sub: `Открывается в ${ext.okCount} из ${ext.total} стран` });
  else Object.assign(people, { state: "err", sub: "Из интернета сайт не открывается" });
  return [laptop, router, domain, people];
}

function nextStep(nodes) {
  const st = S.status;
  if (!st.installed) return { icon: "download", title: "Установите сервер", text: "Одна кнопка — и сайт заработает на этом компьютере. Это займёт пару минут.", act: "go", arg: "install", btn: "Перейти к установке" };
  if (st.service !== "Running") return { icon: "play", title: "Сервер остановлен", text: "Запустите его — сайт снова станет доступен.", act: "svc", arg: "start", btn: "Запустить сервер" };
  const [, router, domain, people] = nodes;
  if (ipType() === "grey") return { icon: "router", title: "Нужен «белый» IP-адрес", text: "Сейчас провайдер не пускает подключения из интернета к вашему роутеру. Посмотрите, как это исправить.", act: "go", arg: "router", btn: "Что делать" };
  if (router.state !== "ok") return { icon: "router", title: "Откройте сайт для интернета", text: "Роутер должен пропускать посетителей к этому компьютеру — попробуем настроить его автоматически.", act: "go", arg: "router", btn: "Настроить роутер" };
  if (domain.state === "todo" || domain.state === "idle") return { icon: "globe", title: "Выберите адрес сайта", text: "Бесплатный адрес вида имя.duckdns.org или свой домен — и сайт получит HTTPS.", act: "go", arg: "domain", btn: "Подключить домен" };
  if (domain.state !== "ok") return { icon: "globe", title: "Домен почти готов", text: domainHealth().text + ". Посмотрите подробности.", act: "go", arg: "domain", btn: "Открыть" };
  if (people.state !== "ok") return { icon: "phone", title: "Проверьте сайт из интернета", text: "Серверы в нескольких странах попробуют открыть ваш сайт.", act: "go", arg: "check", btn: "Проверить" };
  return { good: true, icon: "spark", title: "Всё работает!", text: `Сайт открыт для всех: ${pubLabel()}`, act: "open", arg: publicUrl(), btn: "Открыть сайт" };
}

/* ------------------------------------------------------------ views */
const VIEWS = {
  overview: { title: "Обзор", sub: "Как сайт добирается от этого компьютера до посетителей", icon: "home" },
  install: { title: "Сервер на компьютере", nav: "Сервер", sub: "Веб-сервер Caddy, автозапуск и автообновление сайта", icon: "laptop", num: 1 },
  router: { title: "Роутер и внешний IP", nav: "Роутер", sub: "Чтобы посетители из интернета попадали на этот компьютер", icon: "router", num: 2 },
  domain: { title: "Домен", sub: "Адрес сайта в интернете и бесплатный HTTPS", icon: "globe", num: 3 },
  check: { title: "Проверка из интернета", nav: "Проверка", sub: "Открывается ли сайт у людей в других сетях", icon: "phone", num: 4 },
  logs: { title: "Журнал", sub: "Что происходило с сервером", icon: "list" },
};

function renderNav() {
  const st = S.status;
  const nodes = st ? computeMap() : [];
  const stateOf = { install: nodes[0], router: nodes[1], domain: nodes[2], check: nodes[3] };
  const item = (key) => {
    const v = VIEWS[key];
    const n = stateOf[key];
    const cls = n ? n.state : "";
    const num = v.num ? `<span class="num ${cls === "idle" ? "" : cls}">${cls === "ok" ? ic("check", "ic-sm") : v.num}</span>` : "";
    return `<a href="#${key}" class="${S.view === key ? "active" : ""}">${ic(v.icon)}<span>${v.nav || v.title}</span>${num}</a>`;
  };
  $("#nav").innerHTML = item("overview") + `<div class="nav-sep"></div>` + ["install", "router", "domain", "check"].map(item).join("") + `<div class="nav-sep"></div>` + item("logs");
  $("#sidefoot").innerHTML = st ? `
    ${st.installed ? `<button data-act="openfolder">${ic("folder")}<span>Папка C:\\HomeServer</span></button>` : ""}
    ${st.installed ? `<button class="danger" data-act="uninstall">${ic("trash")}<span>Удалить сервер</span></button>` : ""}
    <div class="ver">Панель ${esc(st.version)}</div>` : "";
}

function renderTop() {
  const v = VIEWS[S.view];
  $("#title").textContent = v.title;
  $("#subtitle").textContent = v.sub;
  const sv = serverState();
  $("#statusPill").innerHTML = sv.text ? `<span class="pill ${sv.kind}"><span class="dot"></span>${esc(sv.text)}</span>` : "";
}

function render() {
  if (!S.status) {
    $("#view").innerHTML = `<div class="card"><div class="row">${spin()}<span class="muted">Загружаю состояние…</span></div></div>`;
    return;
  }
  renderNav();
  renderTop();
  const html = { overview: viewOverview, install: viewInstall, router: viewRouter, domain: viewDomain, check: viewCheck, logs: viewLogs }[S.view]();
  $("#view").innerHTML = html;
}

/* --- обзор --- */
function viewOverview() {
  const st = S.status;
  const nodes = computeMap();
  const links = [0, 1, 2].map((i) => nodes[i].state === "ok" && nodes[i + 1].state === "ok");
  const map = nodes.map((n, i) => `
      <div class="node ${n.state}" data-act="go" data-arg="${n.id}" title="Открыть раздел «${esc(n.title)}»">
        <div class="orb">${ic(n.icon)}<span class="badge">${n.state === "idle" ? "" : ic(markIcon[n.state])}</span></div>
        <b>${esc(n.title)}</b><div class="sub">${esc(n.sub)}</div>
      </div>${i < 3 ? `<div class="link ${links[i] ? "on" : ""}"></div>` : ""}`).join("");
  const nx = nextStep(nodes);
  const pub = publicUrl();
  const lan = lanUrl();
  const sv = serverState();
  const task = st.task || {};
  return `
    <div class="card"><h2>${ic("spark")}Карта подключения</h2>
      <p>Каждый кружок — звено цепочки. Зелёный — работает, золотой — следующий шаг, красный — нужна помощь. Нажмите на кружок, чтобы открыть раздел.</p>
      <div class="map">${map}</div>
    </div>
    <div class="card ${nx.good ? "good" : "accent"}"><div class="next ${nx.good ? "good" : ""}">
      <div class="ico">${ic(nx.icon, "ic-lg")}</div>
      <div class="grow" style="flex:1"><h3>${esc(nx.title)}</h3><p>${esc(nx.text)}</p></div>
      <button class="btn gold big" data-act="${nx.act}" data-arg="${esc(nx.arg)}">${esc(nx.btn)}${ic("arrow")}</button>
    </div></div>
    ${st.vpn.length ? vpnCallout() : ""}
    <div class="grid2">
      <div class="card"><h2>${ic("wifi")}Сайт в домашней сети</h2>
        ${st.installed && lan ? `<div class="qrbox">${qrSvg(lan, 120)}<div>
          <div class="biglink mono ${lan.length > 26 ? "long" : ""}">${esc(lan)}</div>
          <p class="muted small" style="margin:6px 0 12px">Наведите камеру телефона, подключённого к этому же Wi-Fi.</p>
          <div class="row"><button class="btn sm" data-act="open" data-arg="${esc(lan)}">${ic("external", "ic-sm")}Открыть</button><button class="btn sm" data-act="copy" data-arg="${esc(lan)}">${ic("copy", "ic-sm")}Копировать</button></div>

      <div class="card"><h2>${ic("globe")}Сайт в интернете</h2>

          <p class="muted small" style="margin:6px 0 12px">Проверьте с телефона через мобильный интернет, выключив Wi-Fi.</p>
          <div class="row"><button class="btn sm" data-act="open" data-arg="${esc(pub)}">${ic("external", "ic-sm")}Открыть</button><button class="btn sm" data-act="copy" data-arg="${esc(pub)}">${ic("copy", "ic-sm")}Копировать</button></div>
        </div></div>` : `<p class="muted">Пока не настроен. Пройдите шаги «Роутер» и «Домен» — здесь появится адрес и QR-код.</p>`}
      </div>
    </div>
    <div class="grid3">
      <div class="card"><h2>${ic("server")}Веб-сервер</h2>
        <div class="row" style="margin:6px 0 16px"><span class="pill ${sv.kind}"><span class="dot"></span>${esc(sv.text)}</span></div>
        ${st.installed ? `<div class="row">
          <button class="btn sm" data-act="svc" data-arg="restart" ${S.busy.svc ? "disabled" : ""}>${btnBusy("svc", "Перезапустить", "refresh")}</button>
          ${st.service === "Running"
            ? `<button class="btn sm ghost" data-act="svc" data-arg="stop" ${S.busy.svc ? "disabled" : ""}>${ic("stop", "ic-sm")}Остановить</button>`
            : `<button class="btn sm gold" data-act="svc" data-arg="start" ${S.busy.svc ? "disabled" : ""}>${ic("play", "ic-sm")}Запустить</button>`}
        </div>` : `<p class="muted small">Ещё не установлен.</p>`}
      </div>
      <div class="card"><h2>${ic("refresh")}Автообновление</h2>
        ${st.site.sha ? `<dl class="kv small" style="margin:6px 0 14px">
          <dt>Версия</dt><dd class="mono">${esc(st.site.sha.slice(0, 7))}</dd>
          <dt>Обновлено</dt><dd>${esc(st.site.updated)}</dd>
          <dt>Проверка</dt><dd>${task.exists ? "каждые 5 минут" : "выключена"}</dd>
        </dl>
        <button class="btn sm" data-act="update" ${S.busy.update ? "disabled" : ""}>${btnBusy("update", "Обновить сейчас", "download")}</button>`
        : `<p class="muted small">Сайт ещё не скачан.</p>`}
      </div>
      <div class="card"><h2>${ic("laptop")}Компьютер</h2>
        <div class="check"><span class="mark ${st.lan.ip ? "ok" : "warn"}">${ic(st.lan.ip ? "check" : "excl")}</span><div><b>${esc(st.lan.wifi ? "Wi-Fi" : "Сеть")}${st.lan.ssid ? ` «${esc(st.lan.ssid)}»` : ""}</b><span class="note">${st.lan.ip ? `адрес ${esc(st.lan.ip)}` : "нет подключения"}</span></div></div>
        <div class="check"><span class="mark ${st.power ? "ok" : "idle"}">${ic(st.power ? "check" : "excl")}</span><div><b>Не засыпает</b><span class="note">${st.power ? "и при закрытой крышке" : "настроится при установке"}</span></div></div>
        <div class="check"><span class="mark ${st.firewall ? "ok" : "idle"}">${ic(st.firewall ? "check" : "excl")}</span><div><b>Брандмауэр</b><span class="note">${st.firewall ? "порты 80 и 443 открыты" : "настроится при установке"}</span></div></div>
      </div>
    </div>`;
}

function vpnCallout() {
  return `<div class="callout warn">${ic("alert")}<p><b>Похоже, включён VPN (${esc(S.status.vpn.join(", "))}).</b> На компьютере-сервере его лучше выключить: иначе внешний адрес определяется неверно, и посетители могут не попасть на сайт.</p></div>`;
}

/* --- установка --- */

  const inst = S.install;
  if (inst) return installProgress(inst, "Установка", "Устанавливаю сервер…");
  if (st.installed) {
    const sv = serverState();
    return `
      <div class="card good"><div class="next good"><div class="ico">${ic("check", "ic-lg")}</div>
        <div style="flex:1"><h3>Сервер установлен</h3><p>${esc(sv.text)}. Он запускается вместе с Windows и сам обновляет сайт из GitHub.</p></div>
        <button class="btn gold" data-act="go" data-arg="router">Дальше: роутер${ic("arrow")}</button></div></div>
      <div class="grid2">
        <div class="card"><h2>${ic("server")}Что установлено</h2>
          <dl class="kv">
            <dt>Папка</dt><dd class="mono">${esc(st.root)}</dd>
            <dt>Служба</dt><dd>«Домашний сервер (сайт)» · ${st.service === "Running" ? "работает" : "остановлена"}</dd>
            <dt>Сайт</dt><dd><span class="mono">${esc(st.site.repo)}</span>, ветка <span class="mono">${esc(st.site.branch)}</span></dd>
            <dt>Версия</dt><dd class="mono">${esc(st.site.sha.slice(0, 7))} · ${esc(st.site.updated)}</dd>
            <dt>Обновления</dt><dd>${st.task.exists ? `каждые 5 минут${st.task.lastRun ? ` · последняя проверка ${esc(st.task.lastRun)}` : ""}` : "задача не найдена"}</dd>
          </dl>
        </div>
        <div class="card"><h2>${ic("wifi")}Откройте на телефоне</h2>
          ${lanUrl() ? `<div class="qrbox">${qrSvg(lanUrl(), 132)}<div><div class="biglink mono">${esc(lanUrl())}</div><p class="muted small">Телефон должен быть подключён к тому же Wi-Fi, что и компьютер.</p></div></div>` : `<p class="muted">Компьютер не подключён к сети.</p>`}
        </div>
      </div>
      <div class="card"><h2>${ic("refresh")}Переустановка</h2>
        <p>Скачает свежую версию Caddy и сайта и заново применит все настройки. Домен и другие параметры сохранятся.</p>
        <button class="btn" data-act="install">${ic("refresh")}Переустановить</button>
      </div>`;
  }
  const feats = [
    ["server", "Веб-сервер Caddy", "Раздаёт сайт и сам получает бесплатный HTTPS-сертификат."],
    ["download", "Сайт из GitHub", "Скачается сейчас и будет обновляться каждые 5 минут."],
    ["play", "Автозапуск", "Сервер включается вместе с Windows, даже без входа в систему."],
    ["moon", "Без сна", "Компьютер не будет засыпать — и при закрытой крышке тоже."],
    ["shield", "Брандмауэр", "Откроются только порты сайта: 80 и 443."],
    ["folder", "Всё в одной папке", "C:\\HomeServer — удалить можно одной кнопкой."],
  ];
  return `
    <div class="card accent">
      <h2>${ic("laptop")}Установим сервер на этот компьютер</h2>
      <p>Займёт 1–2 минуты, нужен интернет. Ничего вводить не придётся.</p>
      <div class="grid3" style="margin:8px 0 22px">${feats.map(([i, b, s]) => `<div class="feature"><div class="ico">${ic(i)}</div><div><b>${b}</b><span>${s}</span></div></div>`).join("")}</div>
      <button class="btn gold big" data-act="install">${ic("download")}Установить сервер</button>
    </div>
    ${S.status.vpn.length ? vpnCallout() : ""}`;
}

function installProgress(p, verb, runningTitle) {
  const items = p.steps.map((s) => {
    const mark = s.state === "run" ? spin() : s.state === "ok" ? ic("check") : s.state === "error" ? ic("x") : "";
    const cls = s.state === "ok" ? "ok" : s.state === "error" ? "err" : s.state === "run" ? "" : "wait";
    return `<div class="pitem ${s.state === "error" ? "error" : ""} ${s.state}"><span class="mark ${cls}">${mark}</span><div><b>${esc(s.title)}</b>${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</div></div>`;
  }).join("");
  let foot = "";
  if (p.done && p.ok && verb === "Установка") {
    foot = `<div class="card good"><div class="qrbox">${lanUrl() ? qrSvg(lanUrl(), 132) : ""}<div style="flex:1">
      <h2>${ic("spark")}Готово! Сайт работает</h2>
      <p class="muted">Откройте на телефоне в той же сети Wi-Fi: <span class="mono">${esc(lanUrl())}</span></p>
      <div class="row"><button class="btn" data-act="open" data-arg="${esc(lanUrl())}">${ic("external")}Открыть сайт</button><button class="btn gold" data-act="go" data-arg="router">Дальше: роутер${ic("arrow")}</button></div>
    </div></div></div>`;
  } else if (p.done && p.ok) {
    foot = `<div class="card good"><h2>${ic("check")}Сервер удалён</h2><p class="muted">Окно панели можно закрыть. Чтобы поставить сервер снова, нажмите «Установить» в разделе «Сервер на компьютере».</p></div>`;
  } else if (p.done) {
    foot = `<div class="card bad"><h2>${ic("alert")}Не получилось</h2><p class="muted">${esc(p.error || "Один из шагов завершился ошибкой — его описание выше.")}</p>
      <div class="row"><button class="btn gold" data-act="${verb === "Установка" ? "install" : "uninstall"}">${ic("refresh")}Попробовать снова</button><button class="btn" data-act="go" data-arg="logs">${ic("list")}Журнал</button></div></div>`;
  }
  return `<div class="card"><h2>${p.done ? ic("list") : spin()}${p.done ? `${esc(verb)}: итог` : esc(runningTitle)}</h2>
      <div class="plist" id="plist">${items || `<div class="row">${spin()}<span class="muted">Начинаю…</span></div>`}</div></div>${foot}`;
}

/* --- роутер --- */
function viewRouter() {
  const st = S.status;
  const net = S.net;
  const lan = st.lan;
  const gw = lan.gateway ? `http://${lan.gateway}` : "";
  const type = ipType();
  const src = net ? net.ipTypeSource : "";
  let ipCard;
  if (!net) {
    ipCard = `<div class="row">${spin()}<span class="muted">Определяю внешний IP и спрашиваю роутер…</span></div>`;
  } else {
    const verdict = type === "white"
      ? `<div class="callout ok">${ic("check")}<p><b>IP «белый»</b> — посетители из интернета могут попасть на ваш роутер${src === "upnp" ? " (роутер сам сообщил свой адрес)" : ""}.</p></div>`
      : type === "grey"
      ? `<div class="callout err">${ic("x")}<p><b>IP «серый»</b> — провайдер делит один адрес между многими абонентами, и подключения из интернета до вашего роутера не доходят${src === "upnp" ? ` (роутер видит адрес ${esc(net.upnp.wanIp)}, а интернет — ${esc(net.publicIp)})` : ""}. Что делать — ниже.</p></div>`
      : `<div class="callout warn">${ic("info")}<p><b>Автоматически определить не получилось.</b> Проверьте за минуту: откройте настройки роутера, найдите «WAN IP» / «IP-адрес интернета» и сравните с адресом выше. Совпадает — IP белый.</p></div>`;
    ipCard = `
      <div class="row" style="gap:16px;margin-bottom:14px">
        <div><div class="faint small">Ваш адрес в интернете</div><div class="biglink mono">${esc(net.publicIp || "не удалось узнать")}</div></div>
        ${net.upnp.wanIp ? `<div><div class="faint small">Адрес, который видит роутер</div><div class="biglink mono">${esc(net.upnp.wanIp)}</div></div>` : ""}
        <div class="spacer"></div>
        <button class="btn sm ghost" data-act="net" ${S.netBusy ? "disabled" : ""}>${btnBusy("net", "Проверить снова", "refresh")}</button>
      </div>
      ${verdict}
      ${src !== "upnp" ? `<div class="row" style="margin-top:14px">
        ${gw ? `<button class="btn sm" data-act="open" data-arg="${esc(gw)}">${ic("external", "ic-sm")}Открыть настройки роутера</button>` : ""}
        <span class="spacer"></span>
        <span class="faint small">Совпадает?</span>
        <button class="btn sm ${type === "white" ? "gold" : ""}" data-act="iptype" data-arg="white">Да, белый</button>
        <button class="btn sm ${type === "grey" ? "danger" : ""}" data-act="iptype" data-arg="grey">Нет, серый</button>
      </div>` : ""}`;
  }

  const mapped = net && net.upnp.mapped.length >= 2;
  const conflicts = net ? net.upnp.conflicts : [];
  const autoCard = `
    <div class="card ${mapped ? "good" : "accent"}"><h2>${ic("wand")}Открыть порты автоматически</h2>
      <p>Большинство домашних роутеров разрешают программам самим открывать нужные порты (функция UPnP). Панель попросит роутер направлять посетителей сайта на этот компьютер.</p>
      ${mapped ? `<div class="callout ok" style="margin-bottom:14px">${ic("check")}<p><b>Готово:</b> порты 80 и 443 на роутере направлены на этот компьютер (${esc(lan.ip)}).</p></div>` : ""}
      ${conflicts.length ? `<div class="callout warn" style="margin-bottom:14px">${ic("alert")}<p>Порт ${conflicts.map((c) => `${c.port} → ${esc(c.client)}`).join(", ")} уже занят другим устройством. Освободите его в настройках роутера.</p></div>` : ""}
      ${net && !net.upnp.available ? `<div class="callout warn" style="margin-bottom:14px">${ic("info")}<p>Роутер не отвечает по UPnP — функция выключена или не поддерживается. Откройте порты вручную по инструкции ниже (или включите UPnP в настройках роутера и нажмите кнопку ещё раз).</p></div>` : ""}
      <button class="btn ${mapped ? "" : "gold"}" data-act="upnp" ${S.busy.upnp || !st.installed ? "disabled" : ""}>${btnBusy("upnp", mapped ? "Настроить ещё раз" : "Настроить роутер автоматически", "wand")}</button>
      ${!st.installed ? `<span class="faint small" style="margin-left:10px">Сначала установите сервер.</span>` : ""}
    </div>`;

  const manualOpen = S.fold.manual ?? !mapped;
  const manual = `
    <details class="card fold" data-fold="manual" ${manualOpen ? "open" : ""}><summary><h2>${ic("router")}Открыть порты вручную</h2></summary>
      <p class="muted">Если автоматически не вышло — в настройках роутера нужно сделать две вещи. Названия пунктов меню у разных роутеров отличаются, примеры ниже.</p>
      <ol class="steps">
        <li><b>Закрепите за компьютером постоянный адрес</b> (раздел «DHCP», «Резервирование адресов», «Список устройств → Постоянный IP»).
          <div class="grid2" style="margin-top:10px">
            <div class="copybox"><span class="faint small">IP</span><span class="val">${esc(lan.ip || "—")}</span><button class="btn sm ghost" data-act="copy" data-arg="${esc(lan.ip)}">${ic("copy", "ic-sm")}</button></div>
            <div class="copybox"><span class="faint small">MAC</span><span class="val">${esc(lan.mac || "—")}</span><button class="btn sm ghost" data-act="copy" data-arg="${esc(lan.mac)}">${ic("copy", "ic-sm")}</button></div>
          </div></li>
        <li><b>Добавьте два правила переадресации портов</b> («Переадресация портов», «Виртуальные серверы», «Port Forwarding», «NAT»):
          <table class="rules" style="margin-top:10px">
            <tr><th>Протокол</th><th>Внешний порт</th><th>Адрес компьютера</th><th>Внутренний порт</th></tr>
            <tr><td>TCP</td><td class="mono">80</td><td class="mono">${esc(lan.ip || "—")}</td><td class="mono">80</td></tr>
            <tr><td>TCP</td><td class="mono">443</td><td class="mono">${esc(lan.ip || "—")}</td><td class="mono">443</td></tr>
          </table></li>
        <li><b>Если в роутере включено «удалённое управление»</b> на портах 80 или 443 — выключите его или перенесите на другой порт.</li>
      </ol>
      ${gw ? `<button class="btn" data-act="open" data-arg="${esc(gw)}">${ic("external")}Открыть настройки роутера (${esc(lan.gateway)})</button>` : ""}
      <div class="hr"></div>
      ${routerHints()}
    </details>`;

  const greyCard = type === "grey" ? `
    <div class="card bad"><h2>${ic("alert")}Что делать с «серым» IP</h2>
      <ol class="steps">
        <li><b>Попросите у провайдера «белый» IP-адрес</b> (лучше статический). Обычно это недорогая платная услуга — позвоните в поддержку или посмотрите в личном кабинете. Самый надёжный вариант.</li>
        <li><b>Или используйте туннель</b> — программу, которая сама соединяется с внешним сервером, и посетители приходят через него. Роутер тогда не нужен: направьте туннель на <span class="mono">http://localhost:80</span>.
          <div class="muted small" style="margin-top:6px">• <a href="https://tuna.am" target="_blank" rel="noopener">Tuna</a> — российский сервис туннелей; постоянный адрес и свой домен — на платном тарифе.<br>• Cloudflare Tunnel — бесплатный, но с 2025 года сервисы Cloudflare в России работают с перебоями: посетители из России могут не открыть сайт.</div></li>
      </ol>
    </div>` : "";

  return `
    <div class="card"><h2>${ic("globe")}Внешний IP-адрес</h2>${ipCard}</div>
    ${greyCard}
    ${st.vpn.length ? vpnCallout() : ""}
    ${autoCard}
    ${manual}`;
}

function routerHints() {
  const hints = [
    ["Keenetic", "Порты: «Сетевые правила → Переадресация → Добавить правило» — вход: подключение к интернету, выход: этот компьютер, протокол TCP, порт 80; второе правило — для 443.", "Постоянный адрес: «Список устройств» → компьютер → «Постоянный IP-адрес»."],
    ["TP-Link", "Порты: «Дополнительные настройки → NAT переадресация → Виртуальные серверы → Добавить».", "Постоянный адрес: «Сеть → DHCP-сервер → Резервирование адресов»."],
    ["ASUS", "Порты: «Интернет → Переадресация портов → Добавить профиль».", "Постоянный адрес: «Локальная сеть → DHCP-сервер → Назначать IP-адреса вручную»."],
    ["Xiaomi / Redmi", "Порты: «Дополнительно» (Advanced settings) → «Переадресация портов» (Port forwarding).", "Постоянный адрес: «Настройки → Настройки LAN → Привязка IP и MAC»."],
    ["Роутер провайдера (Ростелеком, МТС, Билайн, Дом.ру…)", "Обычно: «Дополнительно» / Advanced → NAT → «Виртуальный сервер» или Port Forwarding.", "Не нашли? Позвоните в поддержку провайдера: «Пробросьте, пожалуйста, порты 80 и 443 на адрес " + (S.status.lan.ip || "моего компьютера") + "». Заодно спросите, «белый» ли у вас IP."],
  ];
  return hints.map(([name, a, b], i) => `<details class="acc" data-fold="hint${i}" ${S.fold["hint" + i] ? "open" : ""}><summary>${esc(name)}</summary><div class="body"><p>${esc(a)}</p><p>${esc(b)}</p></div></details>`).join("");
}

/* --- домен --- */
function viewDomain() {
  const st = S.status;
  const tab = S.domainTab || (st.ddns === "custom" || (st.domains.length && !st.duckName) ? "custom" : "duckdns");
  const f = S.form;
  const ip = publicIp();
  const seg = `<div class="seg" role="tablist">
      <button class="${tab === "duckdns" ? "on" : ""}" data-act="dtab" data-arg="duckdns">Бесплатный адрес DuckDNS</button>
      <button class="${tab === "custom" ? "on" : ""}" data-act="dtab" data-arg="custom">Свой домен</button>
      <button class="${tab === "none" ? "on" : ""}" data-act="dtab" data-arg="none">Без домена</button></div>`;
  let form = "";
  if (tab === "duckdns") {
    const name = f.duckName ?? st.duckName;
    form = `
      <ol class="steps">
        <li><b>Откройте duckdns.org и войдите</b> — через GitHub, Google или другой аккаунт. Это бесплатно.
          <div style="margin-top:8px"><button class="btn sm" data-act="open" data-arg="https://www.duckdns.org">${ic("external", "ic-sm")}Открыть duckdns.org</button></div></li>
        <li><b>Придумайте имя</b> латиницей (например, <span class="mono">kutuzovsky12</span>), впишите его на сайте в поле «sub domain» и нажмите «add domain». Это же имя введите здесь:
          <div class="input" style="margin-top:10px;max-width:460px"><input data-f="duckName" value="${esc(name)}" placeholder="kutuzovsky12" autocomplete="off" spellcheck="false"><span class="suffix">.duckdns.org</span></div></li>
        <li><b>Скопируйте «token»</b> — длинный код вверху страницы duckdns.org — и вставьте:
          <div class="input" style="margin-top:10px;max-width:460px"><input data-f="duckToken" type="${S.showToken ? "text" : "password"}" value="${esc(f.duckToken || "")}" placeholder="${st.ddns === "duckdns" ? "сохранён — оставьте пустым" : "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"}" autocomplete="off" spellcheck="false"><button data-act="showtoken" title="Показать">${ic("eye", "ic-sm")}</button></div></li>
      </ol>
      <button class="btn gold big" data-act="savedomain" data-arg="duckdns" ${S.busy.domain ? "disabled" : ""}>${btnBusy("domain", "Подключить адрес", "check")}</button>
      <p class="hint" style="margin-top:12px">DuckDNS следит за сменой вашего IP: панель сама сообщает ему новый адрес каждые 5 минут.</p>`;
  } else if (tab === "custom") {
    const domain = f.domain ?? (st.duckName ? "" : st.domains.map(dn).join(" "));
    const dyn = f.dynamic ?? (st.ddns === "custom");
    form = `
      <ol class="steps">
        <li><b>Купите домен</b> у любого регистратора (для .ru — например, REG.RU или RU-CENTER; обычно от 200 ₽ в год) и впишите его:
          <div class="input" style="margin-top:10px;max-width:460px"><input data-f="domain" value="${esc(domain)}" placeholder="mysite.ru" autocomplete="off" spellcheck="false"></div>
          <div class="hint" style="margin-top:6px">Можно несколько через пробел, например <span class="mono">mysite.ru www.mysite.ru</span>. Кириллические домены (.рф) тоже подходят.</div></li>
        <li><b>В настройках DNS домена</b> у регистратора создайте запись (и такую же для <span class="mono">www</span>, если он нужен):
          <table class="rules" style="margin-top:10px;max-width:560px"><tr><th>Тип</th><th>Имя</th><th>Значение</th><th></th></tr>
          <tr><td class="mono">A</td><td class="mono">@</td><td class="mono">${esc(ip || "ваш внешний IP")}</td><td>${ip ? `<button class="btn sm ghost" data-act="copy" data-arg="${esc(ip)}">${ic("copy", "ic-sm")}</button>` : ""}</td></tr></table></li>
        <li><label class="checkbox" style="margin:0"><input type="checkbox" data-f="dynamic" ${dyn ? "checked" : ""}> <span><b>Мой внешний IP меняется</b> — тогда нужна ссылка обновления динамического DNS (например, у бесплатного <a href="https://desec.io" target="_blank" rel="noopener">deSEC</a>)</span></label>
          ${dyn ? `<div class="input" style="margin-top:10px;max-width:560px"><input data-f="ddnsUrl" value="${esc(f.ddnsUrl || "")}" placeholder="${st.ddns === "custom" ? "сохранена — оставьте пустым" : "https://update.dedyn.io/?hostname=…"}" autocomplete="off" spellcheck="false"></div>` : ""}</li>
      </ol>
      <button class="btn gold big" data-act="savedomain" data-arg="custom" ${S.busy.domain ? "disabled" : ""}>${btnBusy("domain", "Подключить домен", "check")}</button>`;
  } else {
    form = `<p class="muted">Без домена сайт открывается по адресу <span class="mono">${esc(ip ? "http://" + ip : "http://ваш-IP")}</span> — без HTTPS и пока IP не сменится. Для проверки годится, для людей лучше домен.</p>
      ${st.domains.length ? `<button class="btn danger" data-act="savedomain" data-arg="none" ${S.busy.domain ? "disabled" : ""}>${btnBusy("domain", "Отключить домен", "x")}</button>` : ""}`;
  }

  return `
    ${st.domains.length ? domainStatusCard() : ""}
    <details class="card fold" data-fold="domainForm" ${(S.fold.domainForm ?? !st.domains.length) ? "open" : ""}>
      <summary><h2>${ic("globe")}${st.domains.length ? "Сменить адрес" : "Выберите адрес сайта"}</h2></summary>
      <div style="margin:4px 0 18px">${seg}</div>${form}
      ${!st.installed ? `<div class="callout warn" style="margin-top:16px">${ic("info")}<p>Сервер ещё не установлен — адрес сохранится и применится при установке.</p></div>` : ""}
    </details>`;
}

function certHint(err) {
  const e = String(err || "").toLowerCase();
  if (/timeout|timed out|refused|connection|connect:|firewall|unreachable/.test(e)) return "Let's Encrypt не смог достучаться до компьютера: проверьте, что на роутере открыты порты 80 и 443.";
  if (/nxdomain|no valid a|dns problem|no such host|servfail|no a records/.test(e)) return "Домен ещё не указывает на ваш IP. Проверьте DNS и подождите несколько минут.";
  if (/rate ?limit|too many/.test(e)) return "Слишком много попыток подряд — Caddy сам повторит позже.";
  return "Caddy повторит попытку сам. Подробности — в разделе «Журнал».";
}

function domainStatusCard() {
  const st = S.status;
  const net = S.net;
  const rows = st.domains.map((d) => {
    if (!net) return `<div class="check"><span class="mark wait">${spin()}</span><div><b>${esc(dn(d))}</b><span class="note">проверяю…</span></div></div>`;
    const dns = net.dns.find((x) => x.name === d) || { ips: [], ok: false };
    const cert = net.certs.find((x) => x.name === d) || { state: "pending" };
    const dnsRow = dns.ok
      ? `<div class="check"><span class="mark ok">${ic("check")}</span><div><b>DNS: ${esc(dn(d))} → ${esc(dns.ips.join(", "))}</b><span class="note">указывает на ваш внешний IP</span></div></div>`
      : `<div class="check error"><span class="mark err">${ic("x")}</span><div><b>DNS: ${esc(dn(d))} ${dns.ips.length ? "→ " + esc(dns.ips.join(", ")) : "— не найден"}</b><span class="note">${dns.ips.length ? `а должен указывать на ${esc(net.publicIp)}` : "Если только что настроили — подождите 5–10 минут."} ${st.ddns === "duckdns" ? "Проверьте имя и токен DuckDNS." : ""}</span></div></div>`;
    const certRow = cert.state === "ok"
      ? `<div class="check"><span class="mark ok">${ic("lock")}</span><div><b>HTTPS-сертификат получен</b><span class="note">действует до ${esc(cert.until)}, продлевается автоматически</span></div></div>`
      : cert.state === "error"
      ? `<div class="check error"><span class="mark err">${ic("x")}</span><div><b>HTTPS-сертификат пока не получен</b><span class="note">${esc(certHint(cert.error))}</span></div></div>`
      : `<div class="check"><span class="mark warn">${ic("clock")}</span><div><b>HTTPS-сертификат: ожидание</b><span class="note">Caddy получит его сам, когда домен и порты заработают.</span></div></div>`;
    return dnsRow + certRow;
  }).join("");
  return `<div class="card"><div class="row"><h2 style="margin:0">${ic("lock")}Адрес сайта: <span class="mono">${esc(st.domains.map(dn).join(", "))}</span></h2><span class="spacer"></span>
      <button class="btn sm ghost" data-act="net" ${S.netBusy ? "disabled" : ""}>${btnBusy("net", "Проверить", "refresh")}</button></div>
      <div style="margin-top:10px">${rows}</div></div>`;
}

/* --- проверка --- */
function viewCheck() {
  const st = S.status;
  const ext = st.external;
  const target = st.domains.length ? `https://${dn(st.domains[0])}` : (publicIp() ? `http://${publicIp()}` : "ваш внешний адрес");
  let result = "";
  if (S.extBusy) {
    result = `<div class="row" style="margin-top:18px">${spin()}<span class="muted">Серверы в разных странах открывают ${esc(target)}… это 10–30 секунд.</span></div>`;
  } else if (ext) {
    const verdict = ext.ok
      ? `<div class="callout ok">${ic("check")}<p><b>Сайт открывается из интернета.</b> Проверено ${esc(ext.time)} по адресу <span class="mono">${esc(ext.url)}</span>.</p></div>`
      : ext.okCount > 0
      ? `<div class="callout warn">${ic("alert")}<p><b>Открывается не везде (${ext.okCount} из ${ext.total}).</b> Так бывает из-за временных сбоев — повторите проверку через пару минут.</p></div>`
      : `<div class="callout err">${ic("x")}<p><b>Из интернета сайт не открывается.</b> ${esc(extHint(ext))}</p></div>`;
    result = `<div style="margin-top:18px">${verdict}</div>
      <div class="nodes" style="margin-top:14px">${ext.nodes.map((n) => `
        <div class="cnode ${n.ok ? "ok" : "bad"}"><div class="cc">${esc(String(n.cc || "?").toUpperCase())}</div>
          <div><b>${esc(countryName(n.cc, n.country))}${n.city ? ", " + esc(n.city) : ""}</b><span>${n.ok ? `открылся · ${esc(n.code)} · ${esc(n.seconds)} с` : esc(n.text)}</span></div></div>`).join("")}</div>`;
  }
  const pub = publicUrl();
  return `
    <div class="card accent"><h2>${ic("globe")}Открывается ли сайт у других людей?</h2>
      <p>Сервис <a href="https://check-host.net" target="_blank" rel="noopener">check-host.net</a> попросит компьютеры в нескольких странах открыть <span class="mono">${esc(target)}</span> — так же, как это сделает посетитель.</p>
      <button class="btn gold big" data-act="extcheck" ${S.extBusy || !st.installed ? "disabled" : ""}>${S.extBusy ? spin() : ic("play")}<span>${ext ? "Проверить ещё раз" : "Проверить из интернета"}</span></button>
      ${!st.installed ? `<span class="faint small" style="margin-left:10px">Сначала установите сервер.</span>` : ""}
      ${result}
    </div>
    <div class="card"><h2>${ic("phone")}Проверьте сами с телефона</h2>
      ${pub ? `<div class="qrbox">${qrSvg(pub, 140)}<div><div class="biglink mono ${pubLabel().length > 26 ? "long" : ""}">${esc(pubLabel())}</div>
        <p class="muted" style="margin:8px 0 0">Выключите на телефоне Wi-Fi (чтобы зайти через мобильный интернет) и наведите камеру на код.</p>
        <p class="hint" style="margin-top:8px">Из домашней сети сайт по домену может не открываться — это особенность некоторых роутеров. Дома пользуйтесь адресом ${esc(lanUrl())}.</p></div></div>`
      : `<p class="muted">Адрес в интернете появится после настройки роутера и домена.</p>`}
    </div>`;
}

function countryName(cc, fallback) {
  try { return new Intl.DisplayNames(["ru"], { type: "region" }).of(String(cc).toUpperCase()) || fallback; }
  catch (e) { return fallback; }
}

function extHint(ext) {
  const texts = ext.nodes.map((n) => String(n.text || "").toLowerCase()).join(" ");
  if (/ssl|tls|certificate|handshake/.test(texts)) return "Сервер отвечает, но HTTPS-сертификат ещё не готов — проверьте раздел «Домен».";
  if (/resolve|name|nxdomain|dns/.test(texts)) return "Домен не находится в DNS — проверьте раздел «Домен».";
  if (ipType() === "grey") return "У вас «серый» IP — смотрите раздел «Роутер».";
  return "Скорее всего, на роутере не открыты порты 80 и 443 или провайдер их блокирует — смотрите раздел «Роутер».";
}

/* --- журнал --- */
function viewLogs() {
  const tab = S.logsTab;
  const logs = S.logs;
  const body = !logs
    ? `<div class="row">${spin()}<span class="muted">Загружаю…</span></div>`
    : logs.lines.length
    ? `<pre class="log">${logs.lines.map((l) => {
        const cls = /\b(ERROR|FATAL)\b|ошибк/i.test(l) ? "e" : /\bWARN\b/.test(l) ? "w" : "i";
        return `<span class="${cls}">${esc(l)}</span>`;
      }).join("\n")}</pre>`
    : `<p class="muted">Пока пусто.</p>`;
  return `<div class="card">
      <div class="row" style="margin-bottom:16px"><div class="seg">
        <button class="${tab === "caddy" ? "on" : ""}" data-act="logtab" data-arg="caddy">Веб-сервер</button>
        <button class="${tab === "update" ? "on" : ""}" data-act="logtab" data-arg="update">Обновления сайта</button></div>
        <span class="spacer"></span>
        <button class="btn sm" data-act="logtab" data-arg="${tab}">${ic("refresh", "ic-sm")}Обновить</button>
        ${S.status.installed ? `<button class="btn sm" data-act="openlogs">${ic("folder", "ic-sm")}Папка журналов</button>` : ""}
      </div>${body}
      ${logs && logs.path ? `<p class="hint" style="margin-top:10px">${esc(logs.path)}</p>` : ""}</div>`;
}

/* ------------------------------------------------------------ actions */
async function refreshStatus() {
  if (S.polling) return;
  S.polling = true;
  try { S.status = await api("/api/status"); } finally { S.polling = false; }
}
async function refreshNet() {
  if (S.netBusy) return;
  S.netBusy = true; S.busy.net = true; render();
  try { S.net = await api("/api/network"); S.netError = ""; }
  catch (e) { S.netError = e.message; toast(e.message, "err"); }
  finally { S.netBusy = false; S.busy.net = false; render(); }
}
async function loadLogs() {
  S.logs = null; render();
  try { S.logs = await api("/api/logs?name=" + S.logsTab); } catch (e) { S.logs = { lines: [e.message] }; }
  render();
}

async function runStream(kind) {
  const isInstall = kind === "install";
  const state = { steps: [], done: false, ok: null, error: "" };
  if (isInstall) S.install = state; else S.uninstall = state;
  go(isInstall ? "install" : S.view);
  if (!isInstall) showUninstallModal();
  const paint = () => {
    if (isInstall && S.view === "install") $("#view").innerHTML = installProgress(state, "Установка", "Устанавливаю сервер…");
    if (!isInstall) showUninstallModal();
  };
  paint();
  S.streaming = true;
  try {
    await stream(isInstall ? "/api/install" : "/api/uninstall", (m) => {
      if (m.plan) state.steps = m.plan.map((p) => ({ id: p.id, title: p.title, state: "wait", note: "" }));
      if (m.id) {
        const s = state.steps.find((x) => x.id === m.id);
        if (s) { s.state = m.state; if (m.note) s.note = m.note; }
      }
      if (m.done) { state.done = true; state.ok = m.ok; if (m.error) state.error = m.error; }
      paint();
    });
  } catch (e) {
    state.done = true; state.ok = false; state.error = e.message;
  }
  S.streaming = false;
  if (!state.done) { state.done = true; state.ok = false; }
  await refreshStatus().catch(() => {});
  paint();
  render();
  if (isInstall && state.ok) { toast("Сервер установлен — сайт работает!"); refreshNet(); }
}

function showUninstallModal() {
  const p = S.uninstall;
  $("#modal").innerHTML = `<div class="modal-bg"><div class="modal">${installProgress(p, "Удаление", "Удаляю сервер…")}
    ${p.done ? `<div class="row end" style="margin-top:16px"><button class="btn" data-act="closemodal">Закрыть</button></div>` : ""}</div></div>`;
  $("#modal").onclick = null;
}

const ACTIONS = {
  go: (el) => go(el.dataset.arg),
  open: (el) => el.dataset.arg && openUrl(el.dataset.arg),
  copy: (el) => el.dataset.arg && copy(el.dataset.arg),
  install: async () => {
    if (S.status.installed && !(await confirmModal({ title: "Переустановить сервер?", html: "Скачаю свежие версии Caddy и сайта и заново применю настройки. Сайт будет недоступен несколько секунд.", confirm: "Переустановить" }))) return;
    runStream("install");
  },
  uninstall: async () => {
    const ok = await confirmModal({
      title: "Удалить сервер?", danger: true, confirm: "Удалить",
      html: `<p>Будут удалены служба веб-сервера, задача автообновления, правила брандмауэра и папка <span class="mono">C:\\HomeServer</span> (вместе с HTTPS-сертификатами). Сайт перестанет открываться.</p><p>Сам сайт в GitHub и ваш домен не пострадают.</p>`,
    });
    if (ok) runStream("uninstall");
  },
  closemodal: () => { $("#modal").innerHTML = ""; S.uninstall = null; render(); },
  svc: async (el) => {
    S.busy.svc = true; render();
    try { await api("/api/service", { method: "POST", body: { action: el.dataset.arg } }); toast(el.dataset.arg === "stop" ? "Сервер остановлен" : "Сервер запущен"); }
    catch (e) { toast(e.message, "err"); }
    S.busy.svc = false;
    await refreshStatus().catch(() => {});
    render();
  },
  update: async () => {
    S.busy.update = true; render();
    try { const r = await api("/api/update", { method: "POST" }); toast(r.message || "Готово", r.ok ? "ok" : "err"); }
    catch (e) { toast(e.message, "err"); }
    S.busy.update = false;
    await refreshStatus().catch(() => {});
    render();
  },
  net: () => refreshNet(),
  iptype: async (el) => {
    try { await api("/api/ip-type", { method: "POST", body: { value: el.dataset.arg } }); await refreshStatus(); if (S.net && S.net.ipTypeSource !== "upnp") { S.net.ipType = el.dataset.arg; S.net.ipTypeSource = "user"; } render(); }
    catch (e) { toast(e.message, "err"); }
  },
  upnp: async () => {
    S.busy.upnp = true; render();
    try { await api("/api/router/auto", { method: "POST" }); toast("Роутер настроен: порты 80 и 443 открыты"); }
    catch (e) { toast(e.message, "err"); }
    S.busy.upnp = false;
    await refreshNet();
  },
  dtab: (el) => { S.domainTab = el.dataset.arg; render(); },
  showtoken: () => { S.showToken = !S.showToken; render(); },
  savedomain: async (el) => {
    const mode = el.dataset.arg;
    const f = S.form;
    const body = { mode };
    if (mode === "duckdns") { body.name = f.duckName ?? S.status.duckName; body.token = f.duckToken || ""; }
    if (mode === "custom") { body.domain = f.domain ?? S.status.domains.map(dn).join(" "); body.ddnsUrl = (f.dynamic ?? S.status.ddns === "custom") ? (f.ddnsUrl || "") : ""; body.keepDdns = Boolean((f.dynamic ?? S.status.ddns === "custom") && !f.ddnsUrl); }
    if (mode === "none" && !(await confirmModal({ title: "Отключить домен?", html: "Сайт перестанет открываться по домену и останется доступен в домашней сети.", confirm: "Отключить", danger: true }))) return;
    S.busy.domain = true; render();
    try {
      const r = await api("/api/domain", { method: "POST", body });
      S.form.duckToken = ""; S.form.ddnsUrl = ""; S.form.domain = undefined;
      S.fold.domainForm = undefined;
      await refreshStatus().catch(() => {});
      toast(r.domains.length ? "Адрес подключён: " + r.domains.map(dn).join(", ") : "Домен отключён");
      if (r.ddns && /ошибк|ответил/i.test(r.ddns)) toast(r.ddns, "err");
    } catch (e) { toast(e.message, "err"); }
    S.busy.domain = false;
    await refreshStatus().catch(() => {});
    render();
    refreshNet();
  },
  extcheck: async () => {
    S.extBusy = true; render();
    try { await api("/api/external-check", { method: "POST" }); }
    catch (e) { toast(e.message, "err"); }
    S.extBusy = false;
    await refreshStatus().catch(() => {});
    render();
  },
  logtab: (el) => { S.logsTab = el.dataset.arg; loadLogs(); },
  openfolder: () => api("/api/open", { method: "POST", body: { what: "folder" } }).catch((e) => toast(e.message, "err")),
  openlogs: () => api("/api/open", { method: "POST", body: { what: "logs" } }).catch((e) => toast(e.message, "err")),
};

function go(view) {
  if (!VIEWS[view]) view = "overview";
  if (location.hash !== "#" + view) { location.hash = view; return; }
  if (view !== "install" && S.install && S.install.done) S.install = null;
  S.view = view;
  render();
  window.scrollTo({ top: 0 });
  if (view === "logs") loadLogs();
  if ((view === "router" || view === "domain" || view === "overview") && !S.net && !S.netBusy) refreshNet();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  e.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-f]");
  if (!el) return;
  S.form[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "checkbox") render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.closest("[data-f]")) {
    const btn = $('[data-act="savedomain"]');
    if (btn) btn.click();
  }
});
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
// Запоминаем блоки, которые человек сам раскрыл или свернул, — перерисовка их не трогает.
document.addEventListener("click", (e) => {
  const summary = e.target.closest("details[data-fold] > summary");
  if (summary) S.fold[summary.parentElement.dataset.fold] = !summary.parentElement.open;
}, true);

// Окно закрыли — движок панели завершится (сервер с сайтом продолжит работать).
window.addEventListener("pagehide", () => navigator.sendBeacon("/api/bye", new Blob([TOKEN], { type: "text/plain" })));

// Раз в несколько секунд обновляем состояние; перерисовываем, только если что-то
// изменилось и человек не печатает в поле ввода.
async function tick() {
  if (S.disconnected || document.hidden || S.streaming) return;
  const before = JSON.stringify(S.status);
  try { await refreshStatus(); } catch (e) { return; }
  const active = document.activeElement;
  if (active && active.closest && active.closest("[data-f]")) return;
  if (JSON.stringify(S.status) !== before) render();
}

(async function start() {
  render();
  try { await refreshStatus(); } catch (e) { return; }
  S.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : (S.status.installed ? "overview" : "install");
  if (location.hash.slice(1) !== S.view) history.replaceState(null, "", "#" + S.view);
  go(S.view);
  setInterval(tick, 6000);
  setInterval(() => { if (!S.disconnected && !S.streaming) api("/api/ping", { method: "POST" }).catch(() => {}); }, 20000);
  setInterval(() => { if (!document.hidden && !S.disconnected && (S.view === "overview" || S.view === "domain")) refreshNet(); }, 90000);
})();
</script>
</body>
</html>
