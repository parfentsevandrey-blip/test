<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Texture lab</title>
<link rel="icon" href="data:," />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#14120f;color:#e8e0d6;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{width:1200px}
  #head{padding:8px 12px;display:flex;gap:18px;align-items:baseline;border-bottom:1px solid #33302b}
  #head b{font-size:14px;color:#ffbe7a}
  #head span{color:#8d857a}
  #view{width:1200px;height:520px;display:block}
  #maps{display:flex}
  #maps figure{width:300px}
  #maps figcaption{padding:4px 8px;color:#8d857a;background:#1b1815}
  #maps canvas{width:300px;height:300px;display:block;image-rendering:pixelated}
</style>
</head>
<body>
<div id="wrap">
  <div id="head"><b id="tname">—</b><span id="tinfo"></span></div>
  <canvas id="view"></canvas>
  <div id="maps">
    <figure><figcaption>albedo (2×2 tiled — check the seams)</figcaption><canvas id="mA" width="512" height="512"></canvas></figure>
    <figure><figcaption>roughness</figcaption><canvas id="mR" width="512" height="512"></canvas></figure>
    <figure><figcaption>normal</figcaption><canvas id="mN" width="512" height="512"></canvas></figure>
    <figure><figcaption>height</figcaption><canvas id="mH" width="512" height="512"></canvas></figure>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "../js/vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import * as N from '../js/tex/noise.js';
import { REGISTRY } from '../js/tex/index.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
renderer.setSize(1200, 520, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0c0b);
const camera = new THREE.PerspectiveCamera(38, 1200 / 520, 0.05, 100);

/* the same warm-key / cool-fill situation the room is lit with, so what you
   see here is what the surface will look like in the scene */
const key = new THREE.SpotLight(0xffb072, 55, 30, 0.7, 0.9, 2);
key.position.set(-3.6, 1.5, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0012;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0x88a8d8, 0.9);
fill.position.set(4, 3, -2);
scene.add(fill);
scene.add(new THREE.AmbientLight(0x3a4762, 0.5));

// small studio env so roughness/metalness read correctly
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0, '#20262f'); grd.addColorStop(0.52, '#4a4238'); grd.addColorStop(1, '#0d0b09');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 128);
  g.fillStyle = 'rgba(255,190,120,.75)'; g.beginPath(); g.ellipse(70, 74, 34, 16, 0, 0, 7); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  scene.environment = pm.fromEquirectangular(t).texture;
  pm.dispose(); t.dispose();
}

const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0 });

/* a flat panel to judge pattern + tiling, a sphere and a cylinder to judge how
   the normal map and roughness behave over curvature and at grazing angles */
const panelGeo = new THREE.PlaneGeometry(4.2, 4.2, 1, 1);
const panel = new THREE.Mesh(panelGeo, mat);
panel.rotation.x = -Math.PI / 2.35;
panel.position.set(-1.15, 0, 0);
panel.receiveShadow = true;
scene.add(panel);

const ball = new THREE.Mesh(new THREE.SphereGeometry(0.85, 96, 64), mat);
ball.position.set(1.9, 0.55, 0.35);
ball.castShadow = true; ball.receiveShadow = true;
scene.add(ball);

const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.9, 64, 1), mat);
cyl.position.set(3.35, 0.35, -0.5);
cyl.rotation.z = 0.28;
cyl.castShadow = true; cyl.receiveShadow = true;
scene.add(cyl);

camera.position.set(0.6, 3.1, 4.5);
camera.lookAt(0.4, 0.15, 0);
key.target.position.set(0.2, 0, 0);

function drawTiled(canvasId, src) {
  const c = document.getElementById(canvasId);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 512, 512);
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) g.drawImage(src, x * 256, y * 256, 256, 256);
}

window.showTexture = function (name, opts = {}) {
  const entry = REGISTRY[name];
  if (!entry) throw new Error('unknown texture ' + name);
  const size = opts.size || entry.size;
  const t0 = performance.now();
  const out = entry.gen(size, N);
  const ms = performance.now() - t0;

  // validate the contract loudly — a silently wrong array shape is worse than a throw
  const px = size * size;
  const bad = [];
  if (!out.albedo || out.albedo.length !== px * 3) bad.push('albedo must be Float32Array(size*size*3)');
  if (!out.rough || out.rough.length !== px) bad.push('rough must be Float32Array(size*size)');
  if (!out.height || out.height.length !== px) bad.push('height must be Float32Array(size*size)');
  for (const k of ['albedo', 'rough', 'height']) {
    if (out[k]) for (let i = 0; i < out[k].length; i += 997) {
      if (!Number.isFinite(out[k][i])) { bad.push(k + ' contains NaN/Infinity'); break; }
    }
  }
  if (bad.length) throw new Error('contract: ' + bad.join('; '));

  const rep = opts.repeat || [3, 3];
  const mk = (canvas, srgb) => {
    const t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rep[0], rep[1]);
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  };
  const aCanvas = N.rgbCanvas(out.albedo, size, out.ao || null, opts.aoAmount ?? 1);
  const rCanvas = N.grayCanvas(out.rough, size);
  const nCanvas = N.normalCanvas(out.height, size, opts.normal ?? entry.normal);
  const hCanvas = N.grayCanvas(out.height, size);

  for (const k of ['map', 'roughnessMap', 'normalMap', 'metalnessMap']) mat[k]?.dispose?.();
  mat.map = mk(aCanvas, true);
  mat.roughnessMap = mk(rCanvas, false);
  mat.normalMap = mk(nCanvas, false);
  mat.metalnessMap = out.metal ? mk(N.grayCanvas(out.metal, size), false) : null;
  mat.metalness = out.metal ? 1 : (opts.metalness ?? 0);
  mat.normalScale.set(opts.normalScale ?? 1, opts.normalScale ?? 1);
  mat.needsUpdate = true;

  drawTiled('mA', aCanvas); drawTiled('mR', rCanvas);
  drawTiled('mN', nCanvas); drawTiled('mH', hCanvas);

  document.getElementById('tname').textContent = name;
  document.getElementById('tinfo').textContent =
    `${size}² · ${ms.toFixed(0)} ms · tiled ${rep[0]}×${rep[1]} · normal ${(opts.normal ?? entry.normal)}` +
    (out.ao ? ' · has AO' : '') + (out.metal ? ' · has metalness' : '');

  renderer.render(scene, camera);
  window.__ready = { name, ms, size };
  return window.__ready;
};

window.__labReady = true;
renderer.render(scene, camera);
</script>
</body>
</html>
