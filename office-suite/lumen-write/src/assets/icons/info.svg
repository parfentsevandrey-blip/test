<!-- Hand-drawn for Lumen Write (not from Lucide): simple three-primitive
     "info" glyph (circle + line + dot) used for neutral toast notices.
     Kept intentionally simple per the icon guidelines. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <line x1="12" y1="11" x2="12" y2="16" />
  <circle cx="12" cy="7.5" r="0.75" fill="currentColor" stroke="none" />
</svg>
