<!-- Hand-drawn for Lumen Write (not from Lucide): simple two-primitive
     "panel" glyph (rounded rect + divider line) representing the outline
     sidebar toggle. Kept intentionally simple per the icon guidelines. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect x="3" y="3" width="18" height="18" rx="2" />
  <line x1="9" y1="3" x2="9" y2="21" />
</svg>
