<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Lumen Write</title>
<link rel="stylesheet" href="./src/styles/theme.css" />
<link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
<div class="app-shell">

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="titlebar__brand">
      <span class="brand-mark">W</span>
      <span>Lumen Write</span>
    </div>
    <div class="titlebar__title-wrap">
      <input id="doc-title" class="titlebar__title" value="Untitled document" spellcheck="false" />
      <span id="dirty-dot" class="dirty-dot" hidden title="Unsaved changes"></span>
    </div>
    <button class="btn-icon tooltip-right-align" id="theme-toggle" data-tooltip="Toggle theme"></button>
  </div>

  <!-- Menu bar -->
  <div class="menubar" id="menubar"></div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar"></div>

  <!-- Editor body: outline sidebar + document area -->
  <div class="editor-body">
    <aside class="sidebar is-collapsed" id="outline-sidebar">
      <div class="sidebar__inner" id="outline-sidebar-inner"></div>
    </aside>

    <main class="doc-area" id="doc-area">
      <!-- Chrome, not canvas: the ruler lives in its own fixed row above the
           scrollable page area (like Word/Docs), not inside the scrolling
           flow itself — so it can never visually slice through a line of
           body text mid-scroll the way a sticky-inside-scroll ruler would. -->
      <div class="ruler-row" id="ruler-row">
        <div class="ruler" id="ruler" aria-hidden="true"></div>
      </div>
      <div class="doc-scroll" id="doc-scroll">
        <div class="page-wrapper" id="page-wrapper">
          <div class="page-stack" id="page-stack">
            <div class="page-frames" id="page-frames"></div>
            <div class="page" id="page" contenteditable="true" spellcheck="true"></div>
            <div class="page-bands" id="page-bands"></div>
          </div>
        </div>
      </div>
      <div class="start-screen" id="start-screen" hidden></div>
    </main>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="word-count">0 words</span>
    <span id="char-count">0 characters</span>
    <span id="reading-time">1 min read</span>
    <span id="page-indicator">Page 1 of 1</span>
    <span class="statusbar__spacer"></span>
    <div class="statusbar__zoom">
      <span id="zoom-label">100%</span>
      <input type="range" id="zoom-slider" min="50" max="200" step="10" value="100" />
    </div>
  </div>

  <!-- Dialog host -->
  <div id="dialog-root"></div>
</div>

<script type="module" src="./src/renderer.js"></script>
</body>
</html>
