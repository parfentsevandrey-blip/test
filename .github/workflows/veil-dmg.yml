name: Veil VPN — macOS DMG

on:
  push:
    branches: ["**"]
    paths:
      - "VeilVPN/**"
      - ".github/workflows/veil-dmg.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the DMG"
        type: boolean
        default: false
      tag:
        description: "Release tag (defaults to veil-v<version>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: veil-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: VeilVPN
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          candidate="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate"
          fi
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Tor Expert Bundle
        uses: actions/cache@v4
        with:
          path: VeilVPN/build/tor
          key: tor-expert-bundle-${{ hashFiles('VeilVPN/TOR_VERSION') }}

      - name: Fetch Tor Expert Bundle
        run: make tor

      - name: Run unit tests
        run: make test

      - name: Build app
        run: make app

      - name: Package DMG
        run: make dmg

      - name: Collect metadata
        id: meta
        run: |
          version="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la build/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veil-${{ steps.meta.outputs.version }}-dmg
          path: VeilVPN/build/*.dmg
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            VeilVPN/build/xcodebuild.log
            VeilVPN/build/xcodebuild-test.log
          if-no-files-found: ignore

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('veil-v{0}', steps.meta.outputs.version) }}
          name: Veil VPN ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: VeilVPN/build/*.dmg
          body_path: VeilVPN/docs/RELEASE_NOTES.md
