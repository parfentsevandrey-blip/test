name: Delete the macOS release

# One job, one purpose, and then this file goes: the macOS version was
# removed from the repository, and its published release has to go with it.
# It is done from a workflow because a release can only be deleted by a token
# with write access to releases, which this repository's own GITHUB_TOKEN has
# and a session token does not.

on:
  push:
    paths:
      - ".github/workflows/delete-macos-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view macos-latest >/dev/null 2>&1; then
            gh release delete macos-latest --cleanup-tag --yes
            echo "the macOS release and its tag are gone"
          else
            echo "no macOS release to delete"
          fi
