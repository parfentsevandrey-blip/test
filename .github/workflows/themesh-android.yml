name: The Mesh Android

# Builds the phone app (a WebView window around the `themesh` program, svoi/android), runs its unit tests and
# lint, builds the APK and runs the smoke test on an emulator (Android 14, x86_64).
# The APK is kept as a build artifact; a tag themesh-v* also attaches it to a release.
on:
  push:
    branches: ["**"]
    tags: ["themesh-v*"] # path filters are not applied to tag pushes
    paths: ["svoi/android/**", "svoi/cmd/**", "svoi/internal/**", "svoi/go.mod", "svoi/go.sum", ".github/workflows/themesh-android.yml"]
  pull_request:
    paths: ["svoi/android/**", "svoi/cmd/**", "svoi/internal/**", "svoi/go.mod", "svoi/go.sum", ".github/workflows/themesh-android.yml"]
  workflow_dispatch:
    inputs:
      emulator:
        description: "run the smoke test on an emulator"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # (a secret cannot be tested in `if` directly: the answer goes through this variable)
      HAVE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: The program for the three phone processors (libthemesh.so)
        working-directory: svoi/android
        run: sh tools/build-core.sh

      - name: Build the app, run the unit tests and the lint, build the smoke test
        working-directory: svoi/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest

      - name: A release APK signed with your own key (only when the repository has the keystore secrets, see android/README.md)
        if: env.HAVE_KEY == 'true'
        working-directory: svoi/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          THEMESH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THEMESH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THEMESH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/themesh.jks"
          THEMESH_KEYSTORE="$RUNNER_TEMP/themesh.jks" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/themesh.jks"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TheMesh-0.1.0-android.apk"

      - name: What was built
        run: |
          ls -la svoi/android/app/build/outputs/apk/debug/ svoi/android/app/build/outputs/apk/androidTest/debug/
          cp svoi/android/app/build/outputs/apk/debug/app-debug.apk TheMesh-0.1.0-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: themesh-android-apk
          path: |
            TheMesh-0.1.0-android-debug.apk
            TheMesh-0.1.0-android.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themesh-android-reports
          path: |
            svoi/android/app/build/reports/**
            svoi/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    # The smoke test: the app starts, its program answers and proves it knows the app's token, the window shows the
    # interface, the service runs in the foreground, "Выйти" stops the program.
    # Two runs side by side, because the two jobs want different things of the emulator's graphics (see matrix).
    name: emulator (${{ matrix.name }})
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tests of the program and of the window (everything but the pictures): the usual software graphics of the emulator
          # (swiftshader_indirect) is what they were written against and runs them in a few minutes; the second Nearby test, which waits for
          # a conversation of two programs under a time limit, did not survive the slow graphics of the other job (the whole job took 27 minutes).
          - name: tests
            gpu: swiftshader_indirect
            only: -Pandroid.testInstrumentationRunnerArguments.notClass=app.themesh.mobile.GlassShotsTest
          # The pictures of the window (GlassShotsTest, a few minutes to a quarter of an hour: the page of the look «Роса» is heavy for a
          # software renderer). One of them is the page «Настройки → Внешний вид» with the sky picker, which in the usual mode kills the
          # emulator itself (its render thread segfaults ~1 s after the page opens, seen in dmesg; not memory, not the app; it depended on the
          # size of the labels of the picker, not on gradients, shadows, blur, animation, the aspect ratio or the clip: four rounds of variants are in
          # the history of this file). ANGLE over SwiftShader (swangle_indirect) draws the same page and the emulator survives.
          - name: pictures
            gpu: swangle_indirect
            only: -Pandroid.testInstrumentationRunnerArguments.class=app.themesh.mobile.GlassShotsTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The program for the phone processors (the app checks that all three are there)
        working-directory: svoi/android
        run: sh tools/build-core.sh
      - name: The smoke test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          # (the page of the look «Роса» is bigger than the pages of the glass look were: a phone with 2.5 GB is too small for it)
          ram-size: 4096M
          # (what the emulator says about itself goes to a file, for the day it dies again)
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -verbose > /tmp/emulator.log 2>&1
          working-directory: svoi/android
          # (the script also takes the screenshots of the real window that GlassShotsTest wrote, whatever the tests' result)
          script: sh tools/emulator-run.sh -Pandroid.testInstrumentationRunnerArguments.waitSeconds=240 ${{ matrix.only }}
      - name: What the machine says (for the day the emulator vanishes in the middle of the pictures again)
        if: failure()
        run: |
          df -h / /tmp 2>/dev/null || true
          free -m || true
          sudo dmesg 2>/dev/null | tail -40 || true
          echo "--- the emulator's own words (the end)"; tail -n 40 /tmp/emulator.log 2>/dev/null | cut -c1-300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themesh-android-emulator-reports-${{ matrix.name }}
          path: |
            svoi/android/app/build/reports/androidTests/**
            svoi/android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: themesh-android-emulator-diag-${{ matrix.name }}
          path: |
            /tmp/emulator.log
            /tmp/android-runner/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # the window of the app on a real WebView (Android 14 emulator): the glass look, the system bars, the menu, both themes
          name: themesh-android-emulator-screens-${{ matrix.name }}
          path: svoi/android/emulator-shots/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/themesh-v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: themesh-android-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: TheMesh-*-android*.apk
