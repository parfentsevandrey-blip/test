name: macOS DMG

# Builds Veil for Apple Silicon and uploads a .dmg you can download from the
# run's Artifacts.
#
# This exists because the app cannot be built anywhere but on macOS: SwiftUI,
# AppKit and NetworkExtension live in the macOS SDK, which runs only on Apple
# hardware. A macOS runner has all of it, so the build happens there and the
# disk image comes back as an artifact.
#
# About signing, which decides whether the result actually runs:
#
#   - With no secrets set, the app is signed ad-hoc. It builds, installs and
#     launches, and the *tunnel will not start*: a packet tunnel needs the
#     com.apple.developer.networking.networkextension entitlement, and macOS
#     refuses to load a provider whose signature does not carry it. Apple
#     issues that entitlement to paid teams only. This mode is still worth
#     having — it proves the whole thing compiles and packages.
#   - With APPLE_TEAM_ID, APPLE_CERT_P12 and APPLE_CERT_PASSWORD set as
#     repository secrets, it is signed properly and the tunnel works.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version to select (blank picks the newest installed)"
        required: false
        default: ""
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos-dmg.yml"

permissions:
  # Needed to attach the disk image to a release.
  contents: write

jobs:
  build:
    # Liquid Glass needs the macOS 26 SDK, so the newest image available.
    # If this label is not offered yet the job will not start, and the fix is
    # to drop to macos-15 and lower the deployment target in project.yml.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: What this runner actually has
        run: |
          echo "=== runner ==="
          sw_vers
          uname -m
          echo "=== Xcode installs ==="
          ls /Applications | grep -i '^Xcode' || true
          echo "=== selected ==="
          xcodebuild -version
          echo "=== SDKs ==="
          xcodebuild -showsdks | grep -i macos || true

      - name: Select Xcode
        run: |
          set -eu
          if [ -n "${{ inputs.xcode }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"
          else
            # The newest installed, by version order.
            newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "selecting $newest"
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Tools
        run: |
          set -eu
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          brew install xcodegen create-dmg

      - name: Initialise gomobile
        run: |
          export PATH="$HOME/go/bin:$PATH"
          gomobile init

      - name: Fetch tor
        working-directory: macos
        run: ./scripts/fetch-tor.sh

      - name: Build the Go core
        working-directory: macos
        run: |
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-core.sh

      - name: Generate the Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Import the signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "${{ secrets.APPLE_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        working-directory: macos
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -u
          # The whole log goes to a file and only the diagnostics are printed.
          # xcodebuild's output is thousands of lines of module scanning, and
          # the four lines that matter were being lost in it.
          if [ -n "${TEAM:-}" ]; then
            set -- DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic
          else
            # Ad-hoc: proves it compiles and packages. The tunnel will not
            # load without the network-extension entitlement.
            set -- CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO ENABLE_HARDENED_RUNTIME=NO
          fi
          if xcodebuild -project Veil.xcodeproj -scheme Veil \
               -configuration Release -derivedDataPath build "$@" build \
               > build.log 2>&1; then
            echo "build succeeded"
          else
            echo "=== errors ==="
            grep -E "error:" build.log \
              | sed 's|/Users/runner/work/test/test/||g' \
              | sort -u | head -60
            echo "=== end of errors ==="
            exit 1
          fi

      - name: Keep the full build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: macos/build.log
          if-no-files-found: ignore

      - name: Package the disk image
        working-directory: macos
        run: |
          set -eux
          app=$(find build/Build/Products -maxdepth 2 -name "Veil.app" -print -quit)
          test -n "$app"
          mkdir -p dmg && cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Veil" -srcfolder dmg -ov -format UDZO Veil.dmg
          hdiutil imageinfo Veil.dmg | head -5
          ls -lh Veil.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-macOS-arm64
          path: macos/Veil.dmg
          if-no-files-found: error

      - name: Publish the disk image to a release
        working-directory: macos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A fixed tag, so the download link never changes and never expires.
          # An Actions artifact does neither: it needs a signed-in GitHub
          # account to download and it is deleted after ninety days.
          tag="macos-latest"
          notes=$(cat <<'TEXT'
          Veil for macOS — Apple Silicon, macOS 26 (Tahoe).

          **The tunnel will not start in this build, and that is not a bug to
          report.** A packet tunnel needs the entitlement
          `com.apple.developer.networking.networkextension`, which Apple issues
          only to a paid developer team, so this build is signed ad-hoc: the
          window opens and the interface works, but macOS refuses to load the
          network extension.

          To get a build that connects, set `APPLE_TEAM_ID`, `APPLE_CERT_P12`
          and `APPLE_CERT_PASSWORD` as repository secrets and run this workflow
          again. The App Group `group.app.veil.mac` must also belong to your
          team; its name is in `macos/project.yml` and in both entitlements
          files.

          Tor itself is the Tor Project's own binary, from their expert bundle.
          No account, no subscription, and no server of ours anywhere in it.
          TEXT
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Veil.dmg --clobber
          else
            gh release create "$tag" Veil.dmg \
              --title "Veil for macOS (Apple Silicon)" \
              --notes "$notes" --prerelease
          fi
          echo
          echo "Download without signing in:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Veil.dmg"

      - name: If the build failed, say what to look at
        if: failure()
        run: |
          echo "The Swift has never been compiled before this workflow, so the"
          echo "first failures are expected to be in it rather than in the"
          echo "packaging. The build log above names the file and line."
