name: Lumen (macOS)

on:
  push:
    paths:
      - "Lumen/**"
      - ".github/workflows/lumen-macos.yml"
  workflow_dispatch:

concurrency:
  group: lumen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Lumen
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"
          sw_vers
          swift --version
          sysctl -n machdep.cpu.brand_string

      # Постоянный сертификат подписи из секретов (без них — ad-hoc), см. Harbor/README.md.
      - name: Signing identity
        env:
          HARBOR_SIGNING_P12: ${{ secrets.HARBOR_SIGNING_P12 }}
          HARBOR_SIGNING_PASSWORD: ${{ secrets.HARBOR_SIGNING_PASSWORD }}
        run: ../Harbor/release/sign-setup.sh

      - name: Build Lumen.app + DMG
        run: ./scripts/build.sh

      # Тестовые файлы генерируются ffmpeg только здесь, в CI. В приложение он не попадает:
      # Lumen читает Matroska собственным кодом.
      - name: Generate Matroska fixtures
        run: |
          brew install --quiet ffmpeg >/dev/null
          ./scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Self-test demuxer on real files
        run: python3 scripts/selftest.py "dist/Lumen.app/Contents/MacOS/Lumen" "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/selftest"

      # Настоящее воспроизведение через движок плеера (с «Исполняется», обложкой,
      # перемоткой и цветокоррекцией) — и для MKV, и для обычного MP4.
      - name: Self-test playback engine
        run: |
          BIN="dist/Lumen.app/Contents/MacOS/Lumen"
          "$BIN" --selftest-playback "$RUNNER_TEMP/fixtures/h264_aac_ac3_srt.mkv"
          "$BIN" --selftest-playback "$RUNNER_TEMP/selftest/h264_aac_ac3_srt.mkv.out/media.mp4"
          "$BIN" --selftest-playback "$RUNNER_TEMP/fixtures/hevc10_hdr_eac3.mkv"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-dmg
          path: Lumen/dist/Lumen.dmg
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: ${{ runner.temp }}/selftest/*.json
          if-no-files-found: ignore

      # Зелёная сборка сразу попадает в каталог Harbor (см. Harbor/README.md).
      - name: Publish to Harbor catalog
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ../Harbor/release/publish.sh lumen dist/Lumen.app 

  catalog:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/harbor-catalog.yml
