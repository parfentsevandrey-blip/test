name: Lumen (macOS)

on:
  push:
    paths:
      - "Lumen/**"
      - ".github/workflows/lumen-macos.yml"
  workflow_dispatch:

concurrency:
  group: lumen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Lumen
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"
          sw_vers
          swift --version
          sysctl -n machdep.cpu.brand_string

      # Постоянный сертификат подписи из секретов (без них — ad-hoc), см. Harbor/README.md.
      - name: Signing identity
        env:
          HARBOR_SIGNING_P12: ${{ secrets.HARBOR_SIGNING_P12 }}
          HARBOR_SIGNING_PASSWORD: ${{ secrets.HARBOR_SIGNING_PASSWORD }}
        run: ../Harbor/release/sign-setup.sh

      - name: Build Lumen.app + DMG
        run: ./scripts/build.sh

      # Тестовые файлы генерируются ffmpeg только здесь, в CI. В приложение он не попадает:
      # Lumen читает Matroska, DTS и PGS собственным кодом.
      - name: Generate fixtures
        run: |
          brew install --quiet ffmpeg >/dev/null
          ./scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      # Настоящее воспроизведение через движок плеера: открытие, звук, перемотка,
      # переключение дорожек, субтитры (текст и Blu-ray), шаг кадра, снимок.
      - name: Self-test playback engine
        run: python3 scripts/selftest.py "dist/Lumen.app/Contents/MacOS/Lumen" "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/selftest"

      - name: Screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/render"; mkdir -p "$OUT"
          FX="$RUNNER_TEMP/fixtures"
          shot() {
            dist/Lumen.app/Contents/MacOS/Lumen "${@:2}" &
            PID=$!; sleep 7
            screencapture -x "$OUT/$1.png" || true
            kill $PID 2>/dev/null || true; sleep 2
          }
          shot empty --demo-island=0.5,1
          shot pgs --demo-open="$FX/h264_pgs.mkv" --demo-seek=1.6 --demo-subtitle=1 --demo-island=0.5,1
          shot tracks --demo-open="$FX/h264_aac_dts.mkv" --demo-seek=3 --demo-panel=tracks --demo-island=0.5,1
          shot island-corner --demo-open="$FX/h264_aac_ac3_srt.mkv" --demo-seek=1.5 --demo-subtitle=1 --demo-island=0,0
          shot island-right --demo-open="$FX/vp9_opus.webm" --demo-seek=2 --demo-island=1,0.5
          shot mp4 --demo-open="$FX/h264_aac_text.mp4" --demo-seek=1.5 --demo-subtitle=1 --demo-island=0.5,1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumen-render
          path: ${{ runner.temp }}/render
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-dmg
          path: Lumen/dist/Lumen.dmg
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: ${{ runner.temp }}/selftest/*.json
          if-no-files-found: ignore

      # Зелёная сборка сразу попадает в каталог Harbor (см. Harbor/README.md).
      - name: Publish to Harbor catalog
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ../Harbor/release/publish.sh lumen dist/Lumen.app 

  catalog:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/harbor-catalog.yml
