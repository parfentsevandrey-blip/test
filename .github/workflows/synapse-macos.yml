name: Synapse (macOS)

on:
  push:
    paths:
      - "Synapse/**"
      - ".github/workflows/synapse-macos.yml"
  workflow_dispatch:

concurrency:
  group: synapse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Synapse
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"; sw_vers; swift --version; cmake --version | head -1

      # Движок собирается из исходников один раз на версию llama.cpp.
      - name: Restore llama.cpp engine
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: Synapse/Vendor/llama
          key: llama-${{ hashFiles('Synapse/ENGINE_VERSION', 'Synapse/scripts/build-engine.sh') }}-${{ runner.os }}-xcode26

      # Постоянный сертификат подписи из секретов (без них — ad-hoc), см. Harbor/README.md.
      - name: Signing identity
        env:
          HARBOR_SIGNING_P12: ${{ secrets.HARBOR_SIGNING_P12 }}
          HARBOR_SIGNING_PASSWORD: ${{ secrets.HARBOR_SIGNING_PASSWORD }}
        run: ../Harbor/release/sign-setup.sh

      - name: Build llama.cpp engine from source
        run: ./scripts/build-engine.sh

      # Сохраняем сразу, даже если дальше что-то упадёт.
      - name: Save llama.cpp engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Synapse/Vendor/llama
          key: llama-${{ hashFiles('Synapse/ENGINE_VERSION', 'Synapse/scripts/build-engine.sh') }}-${{ runner.os }}-xcode26

      - name: Build Synapse.app + DMG
        run: ./scripts/build.sh

      - name: Self-test logic (offline)
        run: dist/Synapse.app/Contents/MacOS/Synapse --selftest-logic

      - name: Self-test Hugging Face + feed (live)
        run: dist/Synapse.app/Contents/MacOS/Synapse --selftest-hub

      # Настоящая модель: загрузка с обрывом и докачкой, SHA-256, ответы, диалог, остановка, API Ollama/OpenAI.
      - name: Self-test engine (CPU)
        run: dist/Synapse.app/Contents/MacOS/Synapse --selftest-engine

      # Виртуальное видеоядро раннера (Metal Paravirtual) — проверка для сведения.
      - name: Self-test engine (Metal, informational)
        continue-on-error: true
        run: dist/Synapse.app/Contents/MacOS/Synapse --selftest-gpu

      - name: Self-test render
        run: dist/Synapse.app/Contents/MacOS/Synapse --selftest-render "$RUNNER_TEMP/render"

      - name: UI screenshots
        run: |
          for S in welcome onboarding foryou catalog images stretch quiet detail feed library settings settings-memory chat vision; do
            dist/Synapse.app/Contents/MacOS/Synapse --demo-ui $S &
            PID=$!
            if [ "$S" = chat ]; then
              # Пока модель пишет, окно чата должно стоять на месте.
              sleep 30; screencapture -x "$RUNNER_TEMP/render/window-chat-streaming.png" || true; sleep 20
            elif [ "$S" = vision ]; then sleep 50; else sleep 16; fi
            screencapture -x "$RUNNER_TEMP/render/window-$S.png" || echo "screencapture не сработал"
            kill $PID 2>/dev/null || true
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Synapse-render
          path: ${{ runner.temp }}/render
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-dmg
          path: Synapse/dist/Synapse.dmg
          if-no-files-found: error
          compression-level: 0

      # Зелёная сборка сразу попадает в каталог Harbor (см. Harbor/README.md).
      - name: Publish to Harbor catalog
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ../Harbor/release/publish.sh synapse dist/Synapse.app "$RUNNER_TEMP/render/window-foryou.png" "$RUNNER_TEMP/render/window-chat.png" "$RUNNER_TEMP/render/window-catalog.png"

  catalog:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/harbor-catalog.yml
