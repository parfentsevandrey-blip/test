name: Swarm (macOS)

on:
  push:
    paths:
      - "Swarm/**"
      - ".github/workflows/swarm-macos.yml"
  workflow_dispatch:

concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Swarm
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"; sw_vers; swift --version

      - name: Build Swarm.app + DMG
        run: ./scripts/build.sh

      - name: Self-test core
        run: dist/Swarm.app/Contents/MacOS/Swarm --selftest-core

      # Визуализации в PNG — чтобы посмотреть на них глазами.
      - name: Self-test render
        run: dist/Swarm.app/Contents/MacOS/Swarm --selftest-render "$RUNNER_TEMP/render"

      # Настоящее окно с демо-раздачами: широкое и узкое — проверяем, что ничего не обрезается.
      - name: UI screenshots
        run: |
          for W in 1280 1000; do
            dist/Swarm.app/Contents/MacOS/Swarm --demo-ui $W &
            PID=$!
            sleep 10
            screencapture -x "$RUNNER_TEMP/render/window-$W.png" || echo "screencapture не сработал"
            kill $PID 2>/dev/null || true
            sleep 2
          done
          # Вкладки настроек «Сеть» и «Приватность».
          for T in 1 2; do
            dist/Swarm.app/Contents/MacOS/Swarm --demo-ui 1280 --demo-settings $T &
            PID=$!
            sleep 9
            screencapture -x "$RUNNER_TEMP/render/settings-$T.png" || true
            kill $PID 2>/dev/null || true
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Swarm-render
          path: ${{ runner.temp }}/render
          compression-level: 0

      # Движки на одной машине: TCP и uTP с шифрованием, magnet, v2 и гибрид, запросы хешей v2,
      # DHT-узел (анонс и поиск), LSD, веб-сид, чёрный список, анонимный режим.
      - name: Self-test loopback swarm
        run: dist/Swarm.app/Contents/MacOS/Swarm --selftest-loopback "$RUNNER_TEMP"

      # Настоящий рой: свежий торрент netinst Debian — куски с проверкой SHA-1, шифрование и Fast extension
      # с настоящими клиентами, загрузка только по uTP, поиск через DHT без трекеров, проброс порта.
      - name: Self-test real swarm
        run: |
          BASE=https://cdimage.debian.org/debian-cd/current/amd64/bt-cd/
          NAME=$(curl -fsSL "$BASE" | grep -o 'debian-[0-9.]*-amd64-netinst.iso.torrent' | head -1)
          echo "Торрент: $NAME"
          curl -fsSL -o "$RUNNER_TEMP/test.torrent" "$BASE$NAME"
          dist/Swarm.app/Contents/MacOS/Swarm --selftest-internet "$RUNNER_TEMP/test.torrent" "$RUNNER_TEMP/internet"

      # При падении повторяем тест петли под lldb, чтобы в логе был стек всех потоков.
      - name: Backtrace on failure
        if: failure()
        run: |
          lldb --batch -o run -k "thread backtrace all" -k quit -- \
            dist/Swarm.app/Contents/MacOS/Swarm --selftest-loopback "$RUNNER_TEMP" 2>&1 | tail -250 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Swarm-dmg
          path: Swarm/dist/Swarm.dmg
          if-no-files-found: error
          compression-level: 0
