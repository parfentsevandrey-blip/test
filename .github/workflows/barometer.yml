name: Барометр — обновление данных

# Серверный сбор новостей + ИИ-анализ → barometer/web/data.json.
# Дашборд читает этот файл с raw.githubusercontent (там CORS) — надёжно, без прокси.
#
# Триггеры:
#   • push в рабочую ветку (кроме самого data.json) — обновляет сразу;
#   • workflow_dispatch — кнопка «Run workflow» (видна, если ветка дефолтная);
#   • schedule — раз в 30 минут (GitHub запускает расписание ТОЛЬКО с дефолтной
#     ветки; чтобы заработало авто-обновление, сделайте эту ветку дефолтной
#     в Settings → General → Default branch, или влейте её в дефолтную).
#
# Секрет с ключом ИИ добавьте в Settings → Secrets and variables → Actions:
#   OPENROUTER_API_KEY  (или GROQ_API_KEY / MISTRAL_API_KEY / GEMINI_API_KEY).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: ["claude/zealous-tesla-rtntpc"]
    paths-ignore:
      - "barometer/web/data.json"

permissions:
  contents: write

concurrency:
  group: barometer-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-tesla-rtntpc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Сбор данных и ИИ-анализ
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python barometer/refresh_data.py

      - name: Коммит data.json
        run: |
          git config user.name "barometer-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barometer/web/data.json
          if git diff --cached --quiet; then
            echo "Нет изменений — пропуск коммита."
          else
            git commit -m "data: обновление барометра [skip ci]"
            git push origin HEAD:claude/zealous-tesla-rtntpc
          fi
