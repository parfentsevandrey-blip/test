name: The Mesh

on:
  push:
    branches: ["**"]
    tags: ["themesh-v*"]          # releases; path filters are not applied to tag pushes
    paths: ["svoi/**", ".github/workflows/themesh.yml"]
  pull_request:
    paths: ["svoi/**", ".github/workflows/themesh.yml"]
  workflow_dispatch:
    inputs:
      lab:
        description: "also run the real-NAT lab (network namespaces, needs sudo)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: svoi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: vet the real-NAT lab harness (it only builds with its tag)
        run: go vet -tags lab ./lab
      - name: tests (race detector)
        run: go test ./... -race -count=1 -timeout 15m
      - name: every release platform compiles
        run: make dist VERSION=ci
      - uses: actions/upload-artifact@v4
        with:
          name: themesh-dist
          path: svoi/dist/*
          retention-days: 7

  portable:
    # The program also runs on Windows and macOS (the desktop app carries it): the same tests on real machines
    # of those systems (no race detector there: it needs a C compiler on Windows).
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - run: go vet ./...
      - name: go test (on Windows a crash of the Go runtime itself is run again, a failed test never is)
        shell: bash
        run: bash deploy/ci/retry-on-go-crash.sh go test ./... -count=1 -timeout 20m
        env:
          # (the Go runtime of Windows Server 2025 crashes now and then, golang/go#76614, #77955)
          GODEBUG: ${{ runner.os == 'Windows' && 'asyncpreemptoff=1' || '' }}

  docker:
    # The container image of the headless variant (NAS, home server): it builds, starts as an unprivileged user on a fresh
    # volume, shows its state, hands out a sign-in link and an invitation, and quits cleanly when told to stop.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid; the image builds
        run: |
          docker compose -f svoi/docker-compose.yml config -q
          docker build -t themesh svoi
          docker run --rm themesh version
      - name: A network is made on a fresh volume, the container runs it, a link and an invitation come out, it quits with 0
        run: |
          docker volume create themesh-data
          docker run --rm -v themesh-data:/data themesh init --mesh Home --name box --owner ci
          docker run -d --name tm -v themesh-data:/data themesh up --no-browser --ui 127.0.0.1:8777 --no-stun --no-portmap
          ok=0
          for i in $(seq 1 40); do
            if docker exec tm themesh status > status.txt 2>&1; then ok=1; break; fi
            sleep 1
          done
          cat status.txt
          if [ "$ok" != 1 ]; then docker logs tm; exit 1; fi
          docker exec tm themesh url | tee url.txt
          grep -Eq '^http://127\.0\.0\.1:8777/\?t=[0-9a-f]+$' url.txt
          docker exec tm themesh invite | tee invite.txt
          grep -q 'MESH1-' invite.txt
          docker stop -t 20 tm
          code=$(docker inspect -f '{{.State.ExitCode}}' tm)
          echo "exit code: $code"
          docker logs tm | tail -5
          test "$code" = 0

  lab:
    # Real NAT behaviour: cone / symmetric NATs and firewalls built from network
    # namespaces + iptables/conntrack. Needs privileges, so run it on demand.
    if: github.event_name == 'workflow_dispatch' && inputs.lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables conntrack
      - run: sudo -E env "PATH=$PATH" go test -tags lab ./lab -count=1 -v -timeout 20m

  release:
    if: startsWith(github.ref, 'refs/tags/themesh-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: svoi/go.mod
          cache-dependency-path: svoi/go.sum
      - name: build archives
        run: make dist VERSION=${GITHUB_REF_NAME#themesh-v}
      - uses: softprops/action-gh-release@v2
        with:
          files: svoi/dist/*
          generate_release_notes: true
