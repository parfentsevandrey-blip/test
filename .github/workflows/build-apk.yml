name: Build Android APK

# Builds the Brick Storm Godot project into an installable debug .apk and
# uploads it as a workflow artifact. Trigger it manually from the Actions tab
# ("Run workflow") or it runs automatically on pushes that touch game/.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "game/**"
      - ".github/workflows/build-apk.yml"

env:
  GODOT_VERSION: "4.3"
  GODOT_REL: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools & platform
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"

      - name: Download Godot ${{ env.GODOT_REL }} (headless) + export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_REL}"
          curl -sSL -o godot.zip "${BASE}/Godot_v${GODOT_REL}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "${BASE}/Godot_v${GODOT_REL}_export_templates.tpz"
          unzip -o godot.zip
          mv "Godot_v${GODOT_REL}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version
          # install export templates into the location Godot expects
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -o templates.tpz -d tpz >/dev/null
          mv tpz/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Generate debug keystore
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 -deststoretype pkcs12

      - name: Configure Godot editor settings (SDK path + debug keystore)
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: |
          # first run imports resources; it may exit non-zero, that's fine
          godot --headless --path game --import || true

      - name: Export debug APK
        run: |
          set -e
          mkdir -p build
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/brick-storm.apk"
          ls -la build
          test -f build/brick-storm.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-storm-apk
          path: build/brick-storm.apk
          if-no-files-found: error
