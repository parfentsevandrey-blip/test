name: Block (macOS)

on:
  push:
    paths:
      - "Block/**"
      - ".github/workflows/block-macos.yml"
  workflow_dispatch:

concurrency:
  group: block-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Block
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"; sw_vers; swift --version

      # Постоянный сертификат подписи из секретов (без них — ad-hoc), см. Harbor/README.md.
      - name: Signing identity
        env:
          HARBOR_SIGNING_P12: ${{ secrets.HARBOR_SIGNING_P12 }}
          HARBOR_SIGNING_PASSWORD: ${{ secrets.HARBOR_SIGNING_PASSWORD }}
        run: ../Harbor/release/sign-setup.sh

      - name: Build Block.app + DMG
        run: |
          ./scripts/build.sh
          # LaunchServices должен знать проверочный тип файла Block.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f dist/Block.app

      # Каталог правил, секция /etc/hosts, ссылка для Veil, профили — без изменений в системе.
      - name: Self-test logic
        run: dist/Block.app/Contents/MacOS/Block --selftest-logic

      # Настоящее окно с выдуманным состоянием (в системе ничего не меняется) — проверяем раскладку глазами.
      - name: UI screenshots
        run: |
          OUT="$RUNNER_TEMP/render"; mkdir -p "$OUT"
          export BLOCK_HOME="$RUNNER_TEMP/block-demo"
          for S in overview lock lockprompt monitor apps settings services network replacements journal onboarding; do
            dist/Block.app/Contents/MacOS/Block --demo-ui $S > "$OUT/demo-$S.log" 2>&1 &
            PID=$!
            sleep 12
            screencapture -x "$OUT/window-$S.png" || echo "screencapture не сработал"
            kill $PID 2>/dev/null || true
            sleep 2
          done

      # Настоящий Mac раннера: применить и вернуть правила (снимки до и после совпадают), /etc/hosts и
      # аналитика через sudo -n, программа по умолчанию, сторож запуска на безопасной программе Apple.
      # После скриншотов: смена программы по умолчанию оставляет на экране вопрос macOS к человеку.
      - name: Self-test system
        timeout-minutes: 12
        env:
          BLOCK_SUDO: "1"
        run: |
          export BLOCK_HOME="$RUNNER_TEMP/block-home"
          export BLOCK_SHOTS="$RUNNER_TEMP/render"; mkdir -p "$BLOCK_SHOTS"
          cp /etc/hosts "$RUNNER_TEMP/hosts.before"
          dist/Block.app/Contents/MacOS/Block --selftest-system
          cmp /etc/hosts "$RUNNER_TEMP/hosts.before" && echo "/etc/hosts не изменился"

      # Сетевой замок на настоящем Mac: шлюз узнаёт curl по сокету и слушается решений; фильтр pf закрывает
      # прямой выход, через шлюз — выходит; после снятия pf, задание launchd и прокси служб — как были.
      - name: Self-test lock
        timeout-minutes: 8
        env:
          BLOCK_SUDO: "1"
        run: |
          export BLOCK_HOME="$RUNNER_TEMP/block-lock"
          dist/Block.app/Contents/MacOS/Block --selftest-lock

      # Если проверка замка упала посередине — раннер не должен остаться без сети.
      - name: Lock cleanup
        if: always()
        run: |
          sudo /sbin/pfctl -q -a com.apple/block -F all 2>/dev/null || true
          sudo /bin/launchctl bootout system/app.block.netlock 2>/dev/null || true
          sudo rm -f /Library/LaunchDaemons/app.block.netlock.plist
          curl -sS -o /dev/null -w "сеть после проверки: %{http_code}\n" --max-time 10 https://example.com || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Block-render
          path: ${{ runner.temp }}/render
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Block-dmg
          path: Block/dist/Block.dmg
          if-no-files-found: error
          compression-level: 0

      # Зелёная сборка сразу попадает в каталог Harbor (см. Harbor/README.md).
      - name: Publish to Harbor catalog
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ../Harbor/release/publish.sh block dist/Block.app "$RUNNER_TEMP/render/window-overview.png" "$RUNNER_TEMP/render/window-lock.png" "$RUNNER_TEMP/render/window-monitor.png" "$RUNNER_TEMP/render/window-apps.png" "$RUNNER_TEMP/render/window-network.png"

  catalog:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/harbor-catalog.yml
