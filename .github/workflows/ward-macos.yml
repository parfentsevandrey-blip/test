name: Ward (macOS)

on:
  push:
    paths:
      - "Ward/**"
      - ".github/workflows/ward-macos.yml"
  workflow_dispatch:

concurrency:
  group: ward-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Ward
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $XCODE"; sw_vers; swift --version

      - name: Scripts (Node)
        run: node Tests/js-tests.mjs

      # Постоянный сертификат подписи из секретов (без них — ad-hoc), см. Harbor/README.md.
      - name: Signing identity
        env:
          HARBOR_SIGNING_P12: ${{ secrets.HARBOR_SIGNING_P12 }}
          HARBOR_SIGNING_PASSWORD: ${{ secrets.HARBOR_SIGNING_PASSWORD }}
        run: ../Harbor/release/sign-setup.sh

      # Списки фильтров на сегодня — в бандл (scripts/build.sh скачивает их сам).
      - name: Build Ward.app + DMG
        run: ./scripts/build.sh

      # Копия для самопроверок: свой идентификатор (своя папка песочницы) и право поднять стенд
      # (HTTP- и SOCKS-сервер на этом Mac). Самому Ward это право не нужно.
      - name: Test copy
        run: |
          T="$RUNNER_TEMP/WardTest.app"; rm -rf "$T"; cp -R dist/Ward.app "$T"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier app.ward.browser.selftest" "$T/Contents/Info.plist"
          codesign --force --sign - --timestamp=none --options runtime --entitlements scripts/WardTest.entitlements "$T"
          echo "WARD_TEST=$T/Contents/MacOS/Ward" >> "$GITHUB_ENV"
          echo "WARD_HOME=$HOME/Library/Containers/app.ward.browser.selftest/Data/ward-home" >> "$GITHUB_ENV"

      # Логика — на самом Ward из образа: заодно видно, что в песочнице он читает списки из бандла.
      - name: Self-test logic (offline)
        run: |
          env -u WARD_HOME dist/Ward.app/Contents/MacOS/Ward --selftest-logic
          # Снимок экрана после каждой самопроверки: видно, не вызвала ли она системный запрос
          # (например, «найти устройства в локальной сети»).
          mkdir -p "$RUNNER_TEMP/render"; screencapture -x "$RUNNER_TEMP/render/after-selftest-logic.png" || true

      # Настоящий WebKit: сборка всех правил, стенд на этом Mac с рекламой и трекерами,
      # скриптлеты, отказ от cookie, подделки, строгий режим, контейнеры, прокси, песочница.
      - name: Self-test WebKit (end-to-end)
        timeout-minutes: 20
        run: |
          "$WARD_TEST" --selftest-webkit
          mkdir -p "$RUNNER_TEMP/render"; screencapture -x "$RUNNER_TEMP/render/after-selftest-webkit.png" || true

      - name: UI screenshots
        run: |
          OUT="$RUNNER_TEMP/render"; mkdir -p "$OUT"
          # Правила один раз собраны самопроверкой — демо берёт их готовыми (тот же WARD_HOME).
          for S in start page shield dashboard dashboard-bottom dashboard-report bookmarks downloads newtab danger private settings settings-lists settings-data settings-sites settings-network; do
            "$WARD_TEST" --demo-ui $S > "$OUT/demo-$S.log" 2>&1 &
            PID=$!
            if [ "$S" = start ]; then
              # Когда появляется системный запрос «локальная сеть» — серия снимков в начале.
              for T in 4 8 14 22; do sleep $([ $T = 4 ] && echo 4 || echo $((T - PREV))); PREV=$T; screencapture -x "$OUT/start-${T}s.png" || true; done
              sleep 23
            else
            case $S in page) sleep 30;; shield) sleep 34;; dashboard*) sleep 42;; bookmarks) sleep 22;; settings*) sleep 14;; *) sleep 20;; esac
            fi
            screencapture -x "$OUT/window-$S.png" || echo "screencapture не сработал"
            kill $PID 2>/dev/null || true
            sleep 2
          done

      - name: Local network diagnostics
        if: always()
        run: |
          # Кто и к какому адресу вызвал системный запрос «найти устройства в локальной сети».
          log show --last 40m --style compact --predicate 'process == "nehelper" OR subsystem == "com.apple.networkextension" OR eventMessage CONTAINS[c] "local network" OR eventMessage CONTAINS[c] "LocalNetwork" OR eventMessage CONTAINS[c] "mdns" OR eventMessage CONTAINS[c] "multicast"' 2>/dev/null | grep -v '^Timestamp' | tail -400 > "$RUNNER_TEMP/render/local-network.log" || true
          grep -i -E "ward|webkit|prompt|local network" "$RUNNER_TEMP/render/local-network.log" | tail -80 || true

      - name: Crash reports
        if: always()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Ward*.ips 2>/dev/null | head -2); do
            echo "=== $f"
            python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text[text.index("\n") + 1:])
          print("exception:", body.get("exception"), "\ntermination:", body.get("termination", {}).get("indicator"))
          for t in body.get("threads", []):
              if t.get("triggered"):
                  for fr in t.get("frames", [])[:25]:
                      img = body["usedImages"][fr["imageIndex"]].get("name", "?")
                      print("  ", img, fr.get("symbol", hex(fr.get("imageOffset", 0))), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ward-render
          path: ${{ runner.temp }}/render
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Ward-dmg
          path: Ward/dist/Ward.dmg
          if-no-files-found: error
          compression-level: 0

      # Зелёная сборка сразу попадает в каталог Harbor (см. Harbor/README.md).
      - name: Publish to Harbor catalog
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ../Harbor/release/publish.sh ward dist/Ward.app "$RUNNER_TEMP/render/window-page.png" "$RUNNER_TEMP/render/window-dashboard.png" "$RUNNER_TEMP/render/window-shield.png" "$RUNNER_TEMP/render/window-start.png"

  catalog:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/harbor-catalog.yml
