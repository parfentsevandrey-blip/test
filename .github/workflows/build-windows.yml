name: Build Windows App

on:
  push:
    branches:
      - claude/3d-weather-app-windows-fj37kb
    paths:
      - 'weather-app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: weather-app

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: weather-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Windows installer + portable exe
        run: npm run build:win

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-weather-windows
          path: |
            weather-app/dist/*.exe
            weather-app/dist/*.blockmap
          if-no-files-found: error
