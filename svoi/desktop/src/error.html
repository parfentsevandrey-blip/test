<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Свои</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f2ee; --fg:#1c2421; --muted:#66706b; --accent:#0e7a5a; --card:#fffdf8; --line:#ddd8cf; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1012; --fg:#e8eeeb; --muted:#8c9893; --accent:#4fe0b0; --card:#161b1e; --line:#2a3235; --err:#ff8a80; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; }
  main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { max-width:560px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; box-sizing:border-box; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0 0 14px; color:var(--muted); }
  pre { margin:0 0 18px; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); color:var(--err); white-space:pre-wrap; word-break:break-word; font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; max-height:180px; overflow:auto; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { font:inherit; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { button.primary { color:#05231a; } }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="card" role="alert">
    <h1 id="title">«Свои» не смогли запуститься</h1>
    <p id="hint"></p>
    <pre id="message"></pre>
    <div class="row">
      <button class="primary" id="restart" type="button">Запустить ещё раз</button>
      <button id="logs" type="button">Показать журнал</button>
      <button id="quit" type="button">Закрыть</button>
    </div>
  </div>
</main>
<script src="pages.js"></script>
</body>
</html>
