<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Mesh</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f2ee; --fg:#1c2421; --muted:#66706b; --accent:#0e7a5a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1012; --fg:#e8eeeb; --muted:#8c9893; --accent:#4fe0b0; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  svg { width:72px; height:72px; }
  .dot { animation: pulse 1.4s ease-in-out infinite; transform-origin:center; }
  @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none } }
  p { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <path d="M256 150 150 338h212Z" fill="none" stroke="var(--accent)" stroke-opacity=".55" stroke-width="22" stroke-linejoin="round"/>
    <circle class="dot" cx="256" cy="150" r="48" fill="var(--accent)"/>
    <circle class="dot" cx="150" cy="338" r="48" fill="var(--accent)" style="animation-delay:.2s"/>
    <circle class="dot" cx="362" cy="338" r="48" fill="var(--accent)" style="animation-delay:.4s"/>
  </svg>
  <p id="text" role="status">Запускаем The Mesh…</p>
</main>
<script src="pages.js"></script>
</body>
</html>
