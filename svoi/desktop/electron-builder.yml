# How The Mesh is packaged: an installer for Windows, a .dmg for macOS, an AppImage and a .deb for Linux.
# The `themesh` program itself (built from ../cmd/themesh for the same platform) is put next to the app as a resource.
appId: app.themesh.desktop
productName: The Mesh
executableName: TheMesh
copyright: The Mesh
artifactName: TheMesh-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - assets/**/*
  - package.json
  - '!**/*.map'
asar: true
extraResources:
  - from: bin/${os}-${arch}
    to: bin
    filter:
      - themesh
      - themesh.exe
compression: normal

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # Without a code-signing certificate the installer is unsigned: Windows SmartScreen says so on the first run.
  signAndEditExecutable: true
nsis:
  oneClick: true # no wizard: one click, no administrator rights, installed for this user only
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: The Mesh
  uninstallDisplayName: The Mesh
  deleteAppDataOnUninstall: false # the keys of this device (%APPDATA%\themesh) are never removed by an uninstall
  language: '1049' # Russian
  artifactName: TheMesh-Setup-${version}-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  # Ad-hoc signature: the system needs *a* signature on Apple silicon; there is no Apple developer certificate,
  # so the app is not notarized and Gatekeeper asks for a confirmation on the first start.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    NSHumanReadableCopyright: The Mesh
    # Shown by macOS in its question "Allow The Mesh to find devices on local networks?". Without it the
    # question has no explanation and a "Don't allow" is likelier: the devices at home then do not find this Mac.
    NSLocalNetworkUsageDescription: "The Mesh ищет ваши другие устройства (телефон, ноутбук, сервер) в домашней сети и соединяется с ними напрямую. / The Mesh looks for your other devices (phone, laptop, server) on the home network and connects to them directly."
dmg:
  title: The Mesh ${version}
  artifactName: TheMesh-${version}-mac-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Network
  maintainer: The Mesh <themesh@localhost>
  synopsis: Private network of your own devices
  description: Files, mail and chat directly between your own devices, with no cloud and no account.
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: The Mesh
      Comment: Частная сеть ваших устройств
      Keywords: files;mail;chat;network;vpn;
      StartupWMClass: TheMesh
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
