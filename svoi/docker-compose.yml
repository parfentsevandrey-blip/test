# A headless themesh device (NAS, home server).
#
#   docker compose up -d
#   docker compose exec themesh themesh url   # prints a fresh sign-in address for the web interface
#   docker compose exec themesh themesh invite     # or: themesh join <code>
#
# network_mode: host is the simplest way to have real LAN discovery, direct
# connections and the correct UDP port. On Docker Desktop (macOS/Windows) host
# networking does not expose the real network — use the published ports below.
services:
  themesh:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - themesh-data:/data
      # Folders to share (add the share in the interface as /srv/share):
      # - /mnt/storage:/srv/share
    command: ["up", "--no-browser", "--ui", "127.0.0.1:8777"]
    # Internet mail (settings → "Own address") takes the port 25, which the unprivileged user of the image may not:
    #   cap_add: [NET_BIND_SERVICE]
    #   sysctls: { net.ipv4.ip_unprivileged_port_start: "0" }   # (not allowed with network_mode: host; there use "Where to listen" :2525
    #                                                            and forward the port 25 to it on the router or with iptables)
    # With published ports instead of host networking:
    #   network_mode: bridge
    #   ports: ["41710:41710/udp", "127.0.0.1:8777:8777"]
    #   command: ["up", "--no-browser", "--ui", "0.0.0.0:8777"]
volumes:
  themesh-data:
