appId: com.cinematicweather.app
productName: Cinematic Weather
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
asarUnpack:
  - resources/**
# Copied out of the asar so the main process can load it at runtime as the
# tray icon's fallback image (nativeImage can't read from inside the archive).
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  executableName: cinematic-weather
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
portable:
  # Fixed rather than electron-builder's default (a fresh UUID per build) —
  # a changing extraction path makes Windows treat every rebuild as a new
  # exe/tray icon, resetting any "always show" promotion the user did.
  unpackDirName: cinematic-weather
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
