org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# AGP 9 shrinks resources through R8, which needs resource IDs it can rewrite; final ones cannot
# be. Kotlin does not care either way — a `when` over R ids compiles the same — and this is the
# path Google recommends rather than turning the optimised shrinker off.
android.nonFinalResIds=true

kotlin.code.style=official
