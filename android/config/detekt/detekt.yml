# Builds upon detekt's default config (buildUponDefaultConfig = true); only deviations are listed.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    # Manual DI (ADR 15): orchestrators receive their collaborators through the constructor.
    constructorThreshold: 16
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']
    # Reducers and event dispatchers are flat `when`s over sealed types.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
  NestedBlockDepth:
    threshold: 5

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  # JNI entry points must keep the exact names that the native libraries export/register.
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    excludes: ['**/org/torproject/jni/**']

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
    # Generated icon path data and test fixtures (bridge lines) are long literals by nature.
    excludes: ['**/icon/OpalIcons.kt', '**/src/test/**']
  LoopWithTooManyJumpStatements:
    # Protocol parsers and supervision loops use break/continue idiomatically.
    maxJumpCount: 3
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    # Protocol code (control port, SOCKS5, HTTP) maps each failure to its own exception.
    max: 4
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  UseCheckOrError:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    ignoredExceptionTypes:
      - CancellationException
      - InterruptedException
      - IOException
      - ErrnoException

Compose:
  ModifierMissing:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ComposableNaming:
    active: true
  ViewModelForwarding:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalGlassBackdrops
      - LocalGlassQuality
      - LocalOpalColors
      - LocalOpalTypography
      - LocalReducedMotion
      - LocalHaptics
      - LocalScreenCornerRadius
      - LocalSheetHost
      - LocalToastState
  ParameterNaming:
    active: true
  UnstableCollections:
    active: true
