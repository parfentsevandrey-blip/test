# Builds upon detekt's default config (buildUponDefaultConfig = true); only deviations are listed.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
  NestedBlockDepth:
    threshold: 5

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  # JNI entry points must keep the exact names that the native libraries export/register.
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    excludes: ['**/org/torproject/jni/**']

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  UseCheckOrError:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    ignoredExceptionTypes:
      - CancellationException
      - InterruptedException
      - IOException
      - ErrnoException

Compose:
  ModifierMissing:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ComposableNaming:
    active: true
  ViewModelForwarding:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalGlassBackdrop
      - LocalGlassQuality
      - LocalOpalColors
      - LocalOpalTypography
      - LocalReducedMotion
      - LocalHaptics
  ParameterNaming:
    active: true
  UnstableCollections:
    active: true
